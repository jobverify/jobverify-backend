name: Jobverify Model Smoke Test
run-name: 'Model Smoke Test #${{ github.run_number }}'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobverify-outreach-model-test
  cancel-in-progress: false
jobs:
  model-test:
    if: vars.OUTREACH_ACTIONS_ENABLED == 'true' && vars.OUTREACH_ACTIONS_FREE_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: '--use-system-ca'
    steps:
      - name: Record worker budget start
        run: printf 'OUTREACH_WORKFLOW_STARTED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: npm ci --ignore-scripts
      - name: Cache only the immutable outreach model
        uses: actions/cache@v4
        with:
          path: .cache/outreach-models/LFM2.5-1.2B-Instruct-Q4_K_M.gguf
          key: outreach-lfm25-12b-q4km-b1b3de114215d950
      - name: Verify model inference with synthetic data
        timeout-minutes: 8
        run: node scripts/testOutreachModel.js
