name: Jobverify Tailored Resumes
run-name: 'Tailored Resumes #${{ github.run_number }}'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobverify-tailored-resumes
  cancel-in-progress: false
jobs:
  tailor:
    name: Prepare and tailor requested resumes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NODE_OPTIONS: '--use-system-ca'
    steps:
      - name: Record worker budget start
        run: printf 'TAILORED_RESUME_WORKFLOW_STARTED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /scripts/runTailoredResumes.js
            /src/
            /resume-tailoring/
            /scraper-support/utils/cityNormalizer.js
            /scraper-support/utils/cities.js
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install document worker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare or tailor one requested resume
        timeout-minutes: 1
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: node scripts/runTailoredResumes.js
