name: Jobverify Description Rewrite
run-name: 'Description Rewrite #${{ github.run_number }}'
on:
  workflow_dispatch:
    inputs:
      pipeline_id:
        description: Internal pipeline ID (leave empty for Rewrite then Classification)
        type: string
      dispatch_token:
        description: Internal dispatch identity
        type: string
      pipeline_sha:
        description: Internal source revision
        type: string
permissions:
  contents: read
concurrency:
  group: jobverify-description-rewrite
  cancel-in-progress: false
jobs:
  register:
    name: Register description rewrite
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      queue_as_of: ${{ steps.plan.outputs.queue_as_of }}
    steps:
      - name: ${{ inputs.dispatch_token && format('Description Rewrite [dispatch:{0}]', inputs.dispatch_token) || 'Description Rewrite' }}
        run: echo 'Pipeline dispatch identity recorded'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pipeline_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Claim pipeline stage
        run: node scripts/pipelineGithub.js register
        env:
          GH_TOKEN: ${{ github.token }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PIPELINE_STAGE: rewrite
          PIPELINE_ID: ${{ inputs.pipeline_id }}
          PIPELINE_DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
          PIPELINE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Inspect the complete pending queue
        run: node scripts/rewriteJobDescriptions.js
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JOB_DESCRIPTION_REWRITE_MODE: 'publish'
      - name: Size partitions for the complete queue
        id: plan
        run: node scripts/planDescriptionRewrites.js
        env:
          JOB_DESCRIPTION_REWRITE_JOBS_PER_SHARD: ${{ vars.JOB_DESCRIPTION_REWRITE_JOBS_PER_SHARD || '1000' }}
          JOB_DESCRIPTION_REWRITE_MAX_PARALLEL: ${{ vars.JOB_DESCRIPTION_REWRITE_MAX_PARALLEL || '8' }}
      - name: Upload partition plan
        uses: actions/upload-artifact@v7
        with:
          name: description-rewrite-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/scraper-actions/description-plan.json
          include-hidden-files: true
          retention-days: 14
  rewrite_descriptions:
    name: Rewrite job descriptions (shard ${{ matrix.shard }})
    needs: register
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.register.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.register.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      JOB_DESCRIPTION_REWRITE_MODE: 'publish'
      JOB_DESCRIPTION_REWRITE_SHARD: ${{ matrix.shard }}
      JOB_DESCRIPTION_REWRITE_SHARD_COUNT: ${{ needs.register.outputs.shard_count }}
      JOB_DESCRIPTION_REWRITE_QUEUE_AS_OF: ${{ needs.register.outputs.queue_as_of }}
      PIPELINE_SUMMARY_FILE: '.cache/scraper-actions/description-summary-${{ matrix.shard }}.json'
      JOB_DESCRIPTION_REWRITE_BUDGET_SECONDS: ${{ vars.JOB_DESCRIPTION_REWRITE_BUDGET_SECONDS || '19800' }}
      JOB_DESCRIPTION_REWRITE_CPU_THREADS: '4'
      JOB_DESCRIPTION_REWRITE_CONCURRENCY: ${{ vars.JOB_DESCRIPTION_REWRITE_CONCURRENCY || '4' }}
      JOB_DESCRIPTION_WORKFLOW_BUDGET_SECONDS: '21000'
      NODE_OPTIONS: '--use-system-ca'
      MONGO_URI: ${{ secrets.MONGO_URI }}
    steps:
      - name: Record generation job start
        run: printf 'JOB_DESCRIPTION_WORKFLOW_STARTED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pipeline_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install backend dependencies
        run: npm ci
      - name: Inspect pending description queue
        id: description_queue
        run: |
          node scripts/rewriteJobDescriptions.js
          node -e "const fs=require('node:fs'); const s=JSON.parse(fs.readFileSync(process.env.PIPELINE_SUMMARY_FILE)); fs.appendFileSync(process.env.GITHUB_OUTPUT,'queued='+Number(s.queued || 0)+'\n');"
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
      - name: Cache immutable model and CPU runtime
        if: steps.description_queue.outcome == 'success' && steps.description_queue.outputs.queued != '0'
        uses: actions/cache@v4
        with:
          path: .cache/description-rewriter
          key: description-lfm12b-cpu-${{ runner.os }}-bb741ebb-b11146-14cf1303-c150306e
      - name: Restore validated source-grounded rewrites
        if: steps.description_queue.outcome == 'success' && steps.description_queue.outputs.queued != '0'
        uses: actions/cache/restore@v4
        with:
          path: .cache/description-rewrites
          key: description-lfm12b-rewrites-${{ runner.os }}-v24-${{ github.ref }}-partitions-${{ needs.register.outputs.shard_count }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            description-lfm12b-rewrites-${{ runner.os }}-v24-${{ github.ref }}-partitions-${{ needs.register.outputs.shard_count }}-shard-${{ matrix.shard }}-
      - name: Drain the durable source-hash queue
        if: steps.description_queue.outcome == 'success'
        timeout-minutes: 345
        run: node scripts/rewriteJobDescriptions.js --apply
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
      - name: Save validated source-grounded rewrites for the next batch
        if: always() && steps.description_queue.outcome == 'success' && steps.description_queue.outputs.queued != '0' && hashFiles('.cache/description-rewrites/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/description-rewrites
          key: description-lfm12b-rewrites-${{ runner.os }}-v24-${{ github.ref }}-partitions-${{ needs.register.outputs.shard_count }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload generation quality and capacity diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: description-rewrite-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/scraper-actions/description-summary-${{ matrix.shard }}.json
            .cache/scraper-actions/description-worker-${{ matrix.shard }}.log
            .cache/scraper-actions/description-rejections-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  report:
    name: Report description rewrite results
    needs: [register, rewrite_descriptions]
    if: always() && needs.register.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pipeline_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: description-rewrite-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/scraper-actions
          merge-multiple: true
      - name: Record aggregate stage outcome
        if: always()
        run: node scripts/pipelineGithub.js report
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PIPELINE_STAGE: rewrite
          JOB_DESCRIPTION_REWRITE_SHARD_COUNT: ${{ needs.register.outputs.shard_count }}
          PIPELINE_JOB_RESULT: ${{ needs.rewrite_descriptions.result }}
      - name: Upload aggregate rewrite report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: description-rewrite-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/scraper-actions/description-summary.json
            .cache/scraper-actions/description-plan.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
