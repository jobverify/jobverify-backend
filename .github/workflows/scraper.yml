name: Jobify Scraper Cron

on:
  schedule:
    - cron: '38 20 * * 0,1,2,3,4' # Monday to Friday at 02:08 AM IST
  workflow_dispatch:

concurrency:
  group: jobverify-production-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Install Scraper Dependencies
        run: npm install
        working-directory: ./scraper

      - name: Run Scraper
        run: node scraper/runner.js --parallel
        env:
          NODE_ENV: production
          NODE_OPTIONS: '--use-system-ca'
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SCRAPER_CONCURRENCY: ${{secrets.SCRAPER_CONCURRENCY}}
          WORKDAY_SCRAPER_TIMEOUT_MS: '90000'
          WORKDAY_REQUEST_TIMEOUT_MS: '20000'
          WORKDAY_DETAIL_FETCH_CONCURRENCY: '1'
