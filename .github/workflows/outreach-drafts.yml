name: Jobverify Outreach Drafts
run-name: 'Outreach Drafts #${{ github.run_number }}'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Process queued drafts or verify model inference with synthetic data'
        type: choice
        options:
          - queue
          - smoke-test
        default: queue
        required: true
permissions:
  contents: read
concurrency:
  group: jobverify-outreach-drafts
  cancel-in-progress: false
jobs:
  draft:
    if: vars.OUTREACH_ACTIONS_ENABLED == 'true' && vars.OUTREACH_ACTIONS_FREE_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: '--use-system-ca'
    steps:
      - name: Record worker budget start
        run: printf 'OUTREACH_WORKFLOW_STARTED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check queue configuration
        if: inputs.mode != 'smoke-test'
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo '::error::Add the MONGO_URI repository secret before processing queued drafts.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: npm ci --ignore-scripts
      - name: Cache only the immutable outreach model
        uses: actions/cache@v4
        with:
          path: .cache/outreach-models/LFM2.5-1.2B-Instruct-Q4_K_M.gguf
          key: outreach-lfm25-12b-q4km-b1b3de114215d950
      - name: Generate up to three explicitly requested outreach drafts
        if: inputs.mode != 'smoke-test'
        timeout-minutes: 8
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: node scripts/runOutreachDrafts.js
      - name: Verify model inference with synthetic data
        if: inputs.mode == 'smoke-test'
        timeout-minutes: 8
        run: node scripts/testOutreachModel.js
