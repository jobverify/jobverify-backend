name: Jobverify Pipeline Coordinator
run-name: 'Pipeline Coordinator #${{ github.run_number }}'
on:
  workflow_run:
    workflows: ['Jobverify Scraper Cron', 'Jobverify Description Rewrite', 'Jobverify Post-scrape Classification']
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  continue:
    name: Advance the job processing pipeline
    if: github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Complete and hand off the correlated stage
        run: node scripts/pipelineGithub.js complete
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GH_TOKEN: ${{ github.token }}
