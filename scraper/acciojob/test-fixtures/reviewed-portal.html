          <script>
            
        const imageContainers = document.querySelectorAll('.js-closed-slider');
        imageContainers.forEach(imageContainer => {
            for (let i = 0; i < 2; i++) {
                const images = imageContainer.querySelectorAll('.js-closed-slider-wrapper');
                images.forEach(image => {
                    const clone = image.cloneNode(true);
                    imageContainer.appendChild(clone);
                });
            }
        });
    
            
        const imgElements = document.querySelectorAll(".js-image-content");
        const lastImgElement = imgElements[imgElements.length - 1];
        imgElements.forEach(imgElement => {
            imgElement.addEventListener("mouseover", function () {
                if (imgElement !== lastImgElement) {
                    imgElement.classList.add("kch-on-hover-image");
                    lastImgElement.classList.remove("kch-on-hover-image");
                }
            });

            imgElement.addEventListener("mouseleave", function () {
                if (imgElement !== lastImgElement) {
                    lastImgElement.classList.add("kch-on-hover-image");
                    imgElement.classList.remove("kch-on-hover-image");
                }
            });
        })
            
        const menuToggle = document.querySelector('.kch-menu-toggle');
        const menu = document.querySelector('.kch-nav-list');

        menuToggle?.addEventListener('click', () => {
            menu?.classList.toggle('active');
        });

        const navbarNavigation = document.querySelector('.kch-navbar');
        navbarNavigation?.addEventListener('click', function(event) {
            if(event.target.tagName === 'A') {
              event.preventDefault();
              if(event.target.href) {
                  window.open(event.target.href, '_blank');
              }
            }
        });

        const navbarLogoNavigation = document.querySelector('.kch-company-logo');
        navbarLogoNavigation?.addEventListener('click', function(event) {
            const href = navbarLogoNavigation.getAttribute('href');
            if (href) {
                event.preventDefault();
                if(href) {
                    window.open(href, '_blank');
                }
            }
        });
    
            
        let slidePosition = 0;
        const sliderItem = document.querySelectorAll('.js-slider-item');
        const totalSlider = sliderItem.length;
        
        updatePosition = (previousSlidePosition) => {
            dots.forEach(dot => dot.classList.remove('js-dot-active', 'kch-dot-active' ));
            dots[slidePosition]?.classList.add('js-dot-active', 'kch-dot-active' );
        
            const sliderImage = document.querySelectorAll('.js-slider-image');
            sliderImage.forEach(image => {
                image.classList.remove('js-image-fade-in', 'kch-image-fade-in');
                image.classList.add('js-image-fade-out', 'kch-image-fade-out');
            })
            if(sliderImage[slidePosition]) {
                sliderImage[slidePosition].classList.remove('js-image-fade-out', 'kch-image-fade-out');
                sliderImage[slidePosition].classList.add('js-image-fade-in', 'kch-image-fade-in');
            }
            positionSlider();
            slideAnimation(previousSlidePosition);
        }
        
        slideAnimation = (previousSlidePosition) => {
            sliderItem.forEach((item) => {
                const classList = item.classList;
                classList.remove('js-slide-left', 'kch-slide-left', 'js-slide-right', 'kch-slide-right','js-slide-left-to-right', 'kch-slide-left-to-right', 'js-slide-right-to-left', 'kch-slide-right-to-left');
            })
            
            if (previousSlidePosition === slidePosition) return;
            else if(previousSlidePosition > slidePosition) {
                sliderItem[slidePosition]?.classList.add('js-slide-left-to-right', 'kch-slide-left-to-right');
                sliderItem[previousSlidePosition]?.classList.add('js-slide-right', 'kch-slide-right');
            } else if(previousSlidePosition < slidePosition) {
                sliderItem[slidePosition]?.classList.add('js-slide-right-to-left', 'kch-slide-right-to-left');
                sliderItem[previousSlidePosition]?.classList.add('js-slide-left', 'kch-slide-left');
            }
        }
        
        positionSlider = () => {
            if (sliderItem.length > 1 ){
                sliderItem.forEach((item, index) => {
                    if(slidePosition == index) {
                        item.style.transform = 'translateX(0%)';
                    } else {
                        item.style.transform = index < slidePosition ? 'translateX(-100%)' : 'translateX(100%)';
                    }
                });
            }
            else if (dotContainer){
                dotContainer.style.display = 'none';
            }
        }
        
        const dotContainer = document.querySelector('.js-slider-indicator');
        
        sliderItem.forEach((slide) => {
            const dot = document.createElement('li');
            dot.classList.add('js-indicator-dot', 'kch-indicator-dot');
            dotContainer?.appendChild(dot);
        });
        
        const dots = document.querySelectorAll('.js-indicator-dot');
        dots[slidePosition]?.classList.add('js-dot-active', 'kch-dot-active');
        
        dots.forEach((dot, index) => {
            dot.addEventListener('click', function () {
                let previousSlidePosition = slidePosition;
                slidePosition = index;
                updatePosition(previousSlidePosition);
            });
        });
        
        updatePosition();

        const startCarousel = () => {
            if (totalSlider > 1) {
                setInterval(() => {
                    let previousSlidePosition = slidePosition;
                    slidePosition = (slidePosition + 1) % totalSlider;
                    updatePosition(previousSlidePosition);
                }, 15000);
            } 
        };
          
        startCarousel();
        
            
        const socialMediaNavigation = document.querySelector('.kch-social-media-block');
        socialMediaNavigation?.addEventListener('click', function(event) {
            const socialMediaLink = event.target.closest('a');
            if (socialMediaLink && socialMediaLink.href) {
                event.preventDefault();
                window.open(socialMediaLink.href, '_blank');
            }
        });
    
            
        let currentyear = new Date().getFullYear();
        if (document.getElementById("currentyear")) {
            document.getElementById("currentyear").innerText = currentyear;
        }
    
          </script>
