<html><head><meta property="og:url" content="https://emp.jobylon.com/jobs/389049-epassi-enterprise-systems-specialist/"></head><body><div class="job-id-389049"></div><script type="application/ld+json">{

  "datePosted": "2026-10-08T11:08:44+00:00",
  "description": "<p></p>\n<p>Join one of Europe's fastest-growing companies on a mission to boost everyday wellbeing for millions. As our <strong>Enterprise Systems Specialist</strong>, you won't just be fulfilling a role. You'll be a key player in solidifying Epassi as the #1 provider of employee benefit solutions across Europe.</p>\n<p>This is a full-time, Europe-based role. Remote-first, with occasional travel to Epassi markets.</p>\n<p><strong>Our story:</strong> Epassi's purpose is to boost everyday well-being. Established in Finland in 2007, we were the first company to launch a mobile-payable employee benefit solution in Europe. Today, we are a leading provider across the continent, recognized by the Financial Times as one of the fastest-growing companies on multiple occasions.</p>\n<p><strong>Your impact</strong></p>\n<p>Our enterprise systems estate (NetSuite, Cobase, Lucanet, Zone &amp; Co, plus a growing integration and CRM landscape) is live across multiple European markets and expanding fast. This is not a project delivery role. It is permanent ownership of live systems, with a real mandate to make them measurably better. In this role, you will:</p>\n<ul><li><strong>Own NetSuite technically:</strong> Be one of our internal technical authorities across all live markets. You'll monitor the estate daily, act on issues before Finance teams notice them, and own SuiteScript development (scheduled scripts, user event scripts, Map/Reduce, RESTlets) and SuiteFlow automation. Every change is tested in sandbox, documented and traceable.</li><li><strong>Improve continuously:</strong> Work closely with Finance teams to find what they're working around and where the platform limits rather than enables them. You'll trace problems to their root cause, bring forward improvements with a clear rationale, and track the impact afterwards.</li><li><strong>Grow into integrations and CRM:</strong> Partner with our Integration Specialist on Workato recipe management, diagnosing whether an issue sits in the integration layer or the source system. Over time your scope expands into CRM (e.g. HubSpot) and the wider enterprise systems landscape.</li><li><strong>Lay the foundation for AI and automation:</strong> Keep our data quality, governance and documentation strong enough that automation can be trusted, and surface manual work that could be automated with the operational context needed for a business case.</li></ul>\n<p><strong>What you'll be doing (daily)</strong></p>\n<ul><li>Monitoring NetSuite and the wider FinApps estate across all live markets and resolving issues before they reach Finance</li><li>Developing and maintaining SuiteScript and SuiteFlow solutions</li><li>Managing user accounts, period management and configuration changes within our governance framework</li><li>Investigating failing Workato recipes and reading execution logs alongside the Integration Specialist</li><li>Talking to Finance teams about pain points and turning them into prioritized improvements</li><li>Keeping runbooks, configuration records and process documentation up to date</li><li>Escalating to the FinApps Platform Owner, with full context and documentation, when something is outside your remit</li></ul>\n<p><strong>What you should bring</strong></p>\n<ul><li><strong>Technical depth in NetSuite:</strong> Hands-on experience with SuiteScript development, live production troubleshooting and configuration ownership. You understand how the system works beneath the surface, not just how to use it.</li><li><strong>Integration experience:</strong> Operational experience with an iPaaS platform (Workato, Celigo, Boomi, Azure Integration Services or equivalent). You can investigate a failing integration and read execution logs.</li><li><strong>Finance understanding:</strong> Familiarity with AR, AP, bank reconciliation and period close. You know what the numbers mean and why Finance teams care about them.</li><li><strong>Your track record:</strong> Experience owning live systems and delivering measurable improvements, not just closing tickets.</li><li><strong>Global collaboration:</strong> English is our bridge language, allowing you to collaborate with Epassians from all our locations. </li></ul>\n<p><strong>Core competencies</strong></p>\n<ul><li><strong>Analytical mindset:</strong> You trace problems to the root cause and understand why something works poorly before deciding how to improve it.</li><li><strong>Ownership:</strong> You drive conversations rather than respond to them, and bring improvements forward without waiting to be asked.</li><li><strong>Documentation discipline:</strong> You leave every runbook and process better than you found it, so someone else can pick it up without asking you.</li></ul>\n<p><strong>Why you should join us</strong></p>\n<ul><li>Own the technical outcome. This is not a maintenance role, and the platforms should work measurably better because of your work.</li><li>Work in a live, complex, multi-market environment from day one, with more markets going live through the rest of 2026 and into 2027.</li><li>Follow a clear growth path from NetSuite and integrations into CRM, AI and internal tech projects, with scope expanding as the function builds out around you.</li><li>Help make AI and automation at Epassi possible by ensuring the platform and data foundations can be trusted.</li><li>Be part of an ambitious growth journey and join a global community of driven, bold, entrepreneurial, yet humble Epassians.</li><li>Thrive in an open and inclusive culture with low hierarchy, built on respect and shared successes.</li><li>Come as you are. We'll bring out the best in you and support your personal and professional growth.</li></ul>\n<p><strong>Ready to make an impact, please send your CV and Talent Acquisition will be in touch!</strong></p>\n<p></p> ",
