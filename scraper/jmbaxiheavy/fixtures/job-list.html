<!doctype html>

  </head>
  <body>
    <h1>Explore Your Future with J M Baxi Group</h1>
    <script>

      var selectedLocationOpt = [];
      var home_department = 'Engineering';
      var home_location_city = '';

        $.ajax({
          type: 'POST',
          data: {
            action: 'joblist',
            search_by_text: '',

            selectedDepartmentOpt: selectedDepartmentOpt,
            selectedLocationOpt: selectedLocationOpt,
            page: page,
          },
        });
      }
    </script>
    <div class="section-title-sub-text">Thanks for checking out our job openings. If you don’t find a suitable position, please click <a href="https://jmbone.darwinbox.in/ms/candidate/careers/others?apply=1">here</a> to submit your resume.</div>
