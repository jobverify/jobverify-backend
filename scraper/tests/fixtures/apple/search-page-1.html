3970\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"PIPE-200314033\",\"jobSummary\":\"Apple Retail is where the best of Apple comes together. We bring our expertise to help people do what they love, delivering an only-at-Apple experience. We believe inclusion is a shared responsibility and we work together to foster a culture where everyone belongs and is inspired to do their best work.\\n\\nAs an Operations Expert, you help drive sales and the customer experience by delivering excellence in operations, inventory accuracy and preservation activities. You have a deep understanding of operational practices and mentor the Operations team to complete operational tasks accurately and in accordance with Retail Inventory processes.\",\"locations\":[{\"postLocationId\":\"postLocation-INDC\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"India\",\"countryID\":\"iso-country-IND\",\"level\":1}],\"positionId\":\"200314033\",\"postingDate\":\"27 Jun 2026\",\"postingTitle\":\"IN-Operations Expert\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-27T22:23:13.602101984Z\",\"transformedPostingTitle\":\"in-operations-expert\",\"reqId\":\"PIPE-200314033\",\"managedPipelineRole\":true,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Apple Retail\",\"teamID\":\"teamsAndSubTeams-APPST\",\"teamCode\":\"APPST\"},\"type\":\"PIPE\",\"homeOffice\":false,\"jobPositionId\":\"PIPE-200314033\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"PIPE-200314003\",\"jobSummary\":\"Apple Retail is where the best of Apple comes together. We bring our expertise to help people do what they love, delivering an only-at-Apple experience. We believe inclusion is a shared responsibility and we work together to foster a culture where everyone belongs and is inspired to do their best work.\\n\\nAs a Business Pro, you’re part of a team that’s passionate about helping businesses succeed. The Business Pro develops and grows relationships with high-potential business customers, and builds loyalty by maintaining those relationships. You have strong business and sales acumen, and knowledge of Apple products and services, key Small Medium Business (SMB) industries, business challenges and trends in your local community.\\n\\nYou serve as a resource and mentor for the broader team, and help support an environment where business is integrated into Apple Retail’s culture. You partner with leadership to find opportunities to connect customers with powerful tools and solutions that help their businesses thrive.\",\"locations\":[{\"postLocationId\":\"postLocation-INDC\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"India\",\"countryID\":\"iso-country-IND\",\"level\":1}],\"positionId\":\"200314003\",\"postingDate\":\"27 Jun 2026\",\"postingTitle\":\"IN-Business Pro\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-27T22:23:13.602103289Z\",\"transformedPostingTitle\":\"in-business-pro\",\"reqId\":\"PIPE-200314003\",\"managedPipelineRole\":true,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Apple Retail\",\"teamID\":\"teamsAndSubTeams-APPST\",\"teamCode\":\"APPST\"},\"type\":\"PIPE\",\"homeOffice\":false,\"jobPositionId\":\"PIPE-200314003\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"PIPE-200314010\",\"jobSummary\":\"Apple Retail is where the best of Apple comes together. We bring our expertise to help people do what they love, delivering an only-at-Apple experience. We believe inclusion is a shared responsibility and we work together to foster a culture where everyone belongs and is inspired to do their best work.\\n\\nAs an Expert, you possess a deep understanding of our products and services across the Apple ecosystem. You excel at selling products, offering all of Apple’s services, and delivering an exceptional customer experience. An Expert exemplifies what great customer engagement looks like, and mentors others on how to achieve results.\",\"locations\":[{\"postLocationId\":\"postLocation-INDC\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"India\",\"countryID\":\"iso-country-IND\",\"level\":1}],\"positionId\":\"200314010\",\"postingDate\":\"27 Jun 2026\",\"postingTitle\":\"IN-Expert\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-27T22:23:13.602104626Z\",\"transformedPostingTitle\":\"in-expert\",\"reqId\":\"PIPE-200314010\",\"managedPipelineRole\":true,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Apple Retail\",\"teamID\":\"teamsAndSubTeams-APPST\",\"teamCode\":\"APPST\"},\"type\":\"PIPE\",\"homeOffice\":false,\"jobPositionId\":\"PIPE-200314010\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"PIPE-200314117\",\"jobSummary\":\"Apple Retail is where the best of Apple comes together. We bring our expertise to help people do what they love, delivering an only-at-Apple experience. We believe inclusion is a shared responsibility and we work together to foster a culture where everyone belongs and is inspired to do their best work.\\n\\nAs a Specialist, you build brand loyalty and create owners of Apple products and services. You’re dedicated to selling and delivering a customer service experience that is unlike any other. A Specialist is curious — you ask questions to learn about our customers’ needs, customising recommendations to enrich their lives.\\n\\nIn this role, you could work full-time, part-time or part-time temporary.\",\"locations\":[{\"postLocationId\":\"postLocation-INDC\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"India\",\"countryID\":\"iso-country-IND\",\"level\":1}],\"positio e\":true,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Apple Retail\",\"teamID\":\"teamsAndSubTeams-APPST\",\"teamCode\":\"APPST\"},\"type\":\"PIPE\",\"homeOffice\":false,\"jobPositionId\":\"PIPE-200314122\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"PIPE-200314015\",\"jobSummary\":\"Apple Retail is where the best of Apple comes together. We bring our expertise to help people do what they love, delivering an only-at-Apple experience. At Apple, we believe inclusion is a shared responsibility and we work together to foster a culture where everyone belongs and is inspired to do their best work.\\n\\nAs a Genius, you combine extensive functional troubleshooting skills with an ability to inspire excitement for Apple’s products and services. You deliver exceptional service and empower customers to get the most out of their Apple products and services. A Genius makes sure customers are educated about repair options and Apple offerings, and performs repairs on all Apple products serviced in the store. \\n\\nA Genius excels in repairing relationships with customers and demonstrates the high standard of service and support in our retail stores. You enhance team knowledge by modelling exceptional service and educating and mentoring team members.\",\"locations\":[{\"postLocationId\":\"postLocation-INDC\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"India\",\"countryID\":\"iso-country-IND\",\"level\":1}],\"positionId\":\"200314015\",\"postingDate\":\"27 Jun 2026\",\"postingTitle\":\"IN-Genius\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-27T22:23:13.602107359Z\",\"transformedPostingTitle\":\"in-genius\",\"reqId\":\"PIPE-200314015\",\"managedPipelineRole\":true,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Apple Retail\",\"teamID\":\"teamsAndSubTeams-APPST\",\"teamCode\":\"APPST\"},\"type\":\"PIPE\",\"homeOffice\":false,\"jobPositionId\":\"PIPE-200314015\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"PIPE-200313991\",\"jobSummary\":\"Apple Retail is where the best of Apple comes together. We bring our expertise to help people do what they love, delivering an only-at-Apple experience. We believe inclusion is a shared responsibility and we work together to foster a culture where everyone belongs and is inspired to do their best work.\\n\\nAs a Creative, you foster a learning environment for our customers by helping them set up their products and connect their interests to the Apple ecosystem. Through Apple-led sessions and events, you use your knowledge and interpersonal skills to inspire customers to discover, own and love Apple products.\",\"locations\":[{\"postLocationId\":\"postLocation-INDC\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"India\",\"countryID\":\"iso-country-IND\",\"level\":1}],\"positionId\":\"200313991\",\"postingDate\":\"27 Jun 2026\",\"postingTitle\":\"IN-Creative\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-27T22:23:13.602108245Z\",\"transformedPostingTitle\":\"in-creative\",\"reqId\":\"PIPE-200313991\",\"managedPipelineRole\":true,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Apple Retail\",\"teamID\":\"teamsAndSubTeams-APPST\",\"teamCode\":\"APPST\"},\"type\":\"PIPE\",\"homeOffice\":false,\"jobPositionId\":\"PIPE-200313991\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"200656479-0321\",\"jobSummary\":\"Do you want to help build some of the largest and most consequential enterprise and customer technology systems in the world? Join Apple’s Information Systems and Technology (IS&T) organization.  IS&T is the engine behind everything Apple does for customers and for the people who build for them. It’s Apple’s central nervous system. Supporting 2.5 billion active Apple devices, processing billions of secure transactions, and keeping the technology that defines modern life running flawlessly, IS&T makes the impossible feel effortless.Do you love building solutions to handle global complexity and immense scale? Imagine what you could do here.\\n\\n\\nThe Customer Experience team builds systems that power the cloud-based support apps and tools for Apple products used by millions of our world-wide customers everyday. You will champion your ideas with peers, management and other engineering groups. You will also enjoy the benefits of working in a fast growing business where you are encouraged to “Think Different” and where your efforts play a key role in the success of Apple’s business.\\n\",\"locations\":[{\"postLocationId\":\"postLocation-BGS\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Bengaluru\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200656479\",\"postingDate\":\"25 Jun 2026\",\"postingTitle\":\"Project Manager\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-25T07:02:09.583Z\",\"transformedPostingTitle\":\"project-manager\",\"reqId\":\"200656479-0321\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Software and Services\",\"teamID\":\"teamsAndSubTeams-SFTWR\",\"teamCode\":\"SFTWR\"},\"type\":\"REQ\",\"homeOffice\":false,\"jobPositionId\":\"REQ-200656479\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"200669525-1052\",\"jobSummary\":\"The people here at Apple don’t just build products— they craft the kind of wonder that has revolutionized entire industries. It’s the diversity of those people and their ideas that encourages the innovation that runs through everything we do, from amazing technology to industry-leading environmental efforts. Imagine what you could do here. Join Apple and help us leave the world better than we found it! A job at Apple is unlike any other you’ve had. You will be challenged. You will be inspired. And you’ll be proud! At Apple, phenomenal ideas have a way of becoming phenomenal products, services, and customer experiences very quickly. Bring passion and dedication to your job, and there's no telling what you could accomplish!   \\n\\nAt Apple, we work every day to create products that enrich people’s lives. Apple Ads makes it possible for people around the world to easily access informative and imaginative content on their devices while helping publishers and developers promote and monetize their work. Today, our technology and services power advertising in Search Ads, App Store, and Apple News. Our platforms are highly performant, deployed at scale, and setting new standards for enabling effective advertising while protecting user privacy.   \\n\\nApple Ads Data Platform team powers Ingestion, generic transformation & governance for data across Apple Ads organization. Our mission is to deliver cutting-edge, reliable, and user-friendly managed services for data ingestion, processing, and governance, enabling teams to build data-intensive applications with ease and success.\",\"locations\":[{\"postLocationId\":\"postLocation-HY1\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Hyderabad\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200669525\",\"postingDate\":\"24 Jun 2026\",\"postingTitle\":\"Data Platform Engineer\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-24T09:07:07.173Z\",\"transformedPostingTitle\":\"data-platform-engineer\",\"reqId\":\"200669525-1052\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Software and Services\",\"teamID\":\"teamsAndSubTeams-SFTWR\",\"teamCode\":\"SFTWR\"},\"type\":\"REQ\",\"homeOffice\":false,\"jobPositionId\":\"REQ-200669525\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"200615971-0321\",\"jobSummary\":\"Apple is where individual imaginations gather together, committing to the values that lead to great work. Every new product we build, service we create, is the result of us making each other’s ideas stronger. That happens because every one of us shares a belief that we can make something wonderful and share it with the world, changing lives for the better. It’s the diversity of our people and their thinking that inspires the innovation that runs through everything we do. When we bring everybody in, we can do the best work of our lives. Here, you’ll do more than join something — you’ll add something. \\n\\nDo you want to help build some of the largest and most consequential enterprise and customer technology systems in the world? Join Apple’s Information Systems and Technology (IS&T) organization. IS&T is the engine behind everything Apple does for customers and for the people who build for them. It’s Apple’s central nervous system. Supporting 2.5 billion active Apple devices, processing billions of secure transactions, and keeping the technology that defines modern life running flawlessly, IS&T makes the impossible feel effortless. \\n\\nDo you love building solutions to handle global complexity and immense scale? Imagine what you could do here. \\n\\nAI & Data Platforms (AiDP) is IS&T's engine for AI-powered innovation. The team brings together data, application development, and machine learning — including generative AI — along with data services and customer success functions, to help IS&T build solutions more efficiently and streamline the adoption and embedding of generative AI across Apple.\\n\\n\\n\\n\",\"locations\":[{\"postLocationId\":\"postLocation-BGS\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Bengaluru\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200  for AI-powered innovation. The team brings together data, application development, and machine learning — including generative AI — along with data services and customer success functions, to help IS&T build solutions more efficiently and streamline the adoption and embedding of generative AI across Apple.\\n\\n\\n\\n\",\"locations\":[{\"postLocationId\":\"postLocation-HY1\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Hyderabad\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200615971\",\"postingDate\":\"23 Jun 2026\",\"postingTitle\":\"Site Reliability Engineering Manager\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-23T15:05:48.088Z\",\"transformedPostingTitle\":\"site-reliability-engineering-manager\",\"reqId\":\"200615971-1052\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Software and Services\",\"teamID\":\"teamsAndSubTeams-SFTWR\",\"teamCode\":\"SFTWR\"},\"type\":\"REQ\",\"homeOffice\":false,\"jobPositionId\":\"REQ-200615971\",\"isMultiLocation\":true,\"postExternal\":true},{\"id\":\"200669553-0321\",\"jobSummary\":\"The people here at Apple don’t just build products— they craft the kind of wonder that has revolutionized entire industries. It’s the diversity of those people and their ideas that encourages the innovation that runs through everything we do, from amazing technology to industry-leading environmental efforts. Imagine what you could do here. Join Apple, and help us leave the world better than we found it! A job at Apple is unlike any other you’ve had. You will be challenged. You will be inspired. And you’ll be proud! At Apple, phenomenal ideas have a way of becoming phenomenal products, services, and customer experiences very quickly. Bring passion and dedication to your job, and there's no telling what you could accomplish!  \\n\\nThe regulatory team is looking for an experienced engineer with an excellent understanding of Product certifications, the Indian ICT regulatory ecosystem, established relationships, problem-solving, excellent communication and project management skills. The person should be a good team player and technology enthusiast.\",\"locations\":[{\"postLocationId\":\"postLocation-BGS\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Bengaluru\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200669553\",\"postingDate\":\"23 Jun 2026\",\"postingTitle\":\"Regulatory Compliance Engineer\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-23T11:04:34.296Z\",\"transformedPostingTitle\":\"regulatory-compliance-engineer\",\"reqId\":\"200669553-0321\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Hardware\",\"teamID\":\"teamsAndSubTeams-HRDWR\",\"teamCode\":\"HRDWR\"},\"type\":\"PIPE\",\"homeOffice\":false,\"jobPositionId\":\"PIPE-200669553\",\"isMultiLocation\":true,\"postExternal\":true},{\"id\":\"200669553-1281\",\"jobSummary\":\"The people here at Apple don’t just build products— they craft the kind of wonder that has revolutionized entire industries. It’s the diversity of those people and their ideas that encourages the innovation that runs through everything we do, from amazing technology to industry-leading environmental efforts. Imagine what you could do here. Join Apple, and help us leave the world better than we found it! A job at Apple is unlike any other you’ve had. You will be challenged. You will be inspired. And you’ll be proud! At Apple, phenomenal ideas have a way of becoming phenomenal products, services, and customer experiences very quickly. Bring passion and dedication to your job, and there's no telling what you could accomplish!  \\n\\nThe regulatory team is looking for an experie
