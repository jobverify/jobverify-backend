nsights, ensure our spaces reflect the simplicity and style of our products. Join us to make an impactful difference.\",\"locations\":[{\"postLocationId\":\"postLocation-BGS\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Bengaluru\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200651125\",\"postingDate\":\"05 Jun 2026\",\"postingTitle\":\"Software Engineer - Places\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-05T06:10:10.808Z\",\"transformedPostingTitle\":\"software-engineer-places\",\"reqId\":\"200651125-0321\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Corporate Functions\",\"teamID\":\"teamsAndSubTeams-CORSV\",\"teamCode\":\"CORSV\"},\"type\":\"REQ\",\"homeOffice\":false,\"jobPositionId\":\"REQ-200651125\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"200632502-0321\",\"jobSummary\":\"\\nThe people here at Apple don’t just build products— they craft the kind of wonder that has revolutionized entire industries. It’s the diversity of those people and their ideas that encourages the innovation that runs through everything we do, from amazing technology to industry-leading environmental efforts. Imagine what you could do here. Join Apple, and help us leave the world better than we found it! A job at Apple is unlike any other you’ve had. You will be challenged. You will be inspired. And you’ll be proud! At Apple, phenomenal ideas have a way of becoming phenomenal products, services, and customer experiences very quickly. Bring passion and dedication to your job, and there's no telling what you could accomplish!  \\n\\nThe regulatory team is looking for an experienced engineer with an excellent understanding of Product certifications, the Indian ICT regulatory ecosystem, established relationships, problem-solving, excellent communication and project management skills. The person should be a good team player and technology enthusiast.\",\"locations\":[{\"postLocationId\":\"postLocation-BGS\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Bengaluru\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200632502\",\"postingDate\":\"04 Jun 2026\",\"postingTitle\":\"Regulatory Compliance Engineer\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-04T06:26:46.012Z\",\"transformedPostingTitle\":\"regulatory-compliance-engineer\",\"reqId\":\"200632502-0321\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Hardware\",\"teamID\":\"teamsAndSubTeams-HRDWR\",\"teamCode\":\"HRDWR\"},\"type\":\"REQ\",\"homeOffice\":false,\"jobPositionId\":\"REQ-200632502\",\"isMultiLocation\":true,\"postExternal\":true},{\"id\":\"200632502-1281\",\"jobSummary\":\"\\nThe people here at Apple don’t just build products— they craft the kind of wonder that has revolutionized entire industries. It’s the diversity of those people and their ideas that encourages the innovation that runs through everything we do, from amazing technology to industry-leading environmental efforts. Imagine what you could do here. Join Apple, and help us leave the world better than we found it! A job at Apple is unlike any other you’ve had. You will be challenged. You will be inspired. And you’ll be proud! At Apple, phenomenal ideas have a way of becoming phenomenal products, services, and customer experiences very quickly. Bring passion and dedication to your job, and there's no telling what you could accomplish!  \\n\\nThe regulatory team is looking for an experienced engineer with an excellent understanding of Product certifications, the Indian ICT regulatory ecosystem, established relationships, problem-solving, excellent communication and project management skills. The person should be a good team player and technology enthusiast.\",\"locations\":[{\"postLocationId\":\"postLocation-GHD\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Gurugram\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200632502\",\"postingDate\":\"04 Jun 2026\",\"postingTitle\":\"Regulatory Compliance Engineer\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-04T06:26:46.012Z\",\"transformedPostingTitle\":\"regulatory-compliance-engineer\",\"reqId\":\"200632502-1281\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Hardware\",\"teamID\":\"teamsAndSubTeams-HRDWR\",\"teamCode\":\"HRDWR\"},\"type\":\"REQ\",\"homeOffice\":false,\"jobPositionId\":\"REQ-200632502\",\"isMultiLocation\":true,\"postExternal\":true},{\"id\":\"200657773-1052\",\"jobSummary\":\"Apple is where individual imaginations gather together, committing to the values that lead to great work. Every new product we build, service we create, or Apple Store experience we deliver is the result of us making each other’s ideas stronger. That happens because every one of us shares a belief that we can make something wonderful and share it with the world, changing lives for the better. It’s the diversity of our people and their thinking that inspires the innovation that runs through everything we do. When we bring everybody in, we can do the best work of our lives. Here, you’ll do more than join something — you’ll add something. Apple's Artificial Intelligence and Data Platforms (AiDP) team is seeking an experienced Site Reliability Engineering (SRE) Manager to support scalable and resilient distributed systems that power Apple's data pipelines and analytics platforms. Our Enterprise Data Warehouse landscape caters to a wide variety of real-time, near real-time and batch analytical solutions. These solutions are an integral part of business functions like Sales, Operations, Finance, AppleCare, Marketing and Internet Services, enabling business drivers to make critical decisions. We utilizes proprietary and open source technologies such as Kafka, Spark, Iceberg, Airflow, and others to build these solutions. If you are passionate about addressing infrastructure challenges at scale, both on-premises and in the cloud, and focused on optimizing scalable solutions by prioritizing ease of use and maintenance, you will discover exciting opportunities in AiDP.\",\"locations\":[{\"postLocationId\":\"postLocation-HY1\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Hyderabad\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200657773\",\"postingDate\":\"03 Jun 2026\",\"postingTitle\":\"SRE Engineering Manager\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-03T06:28:14.140Z\",\"transformedPostingTitle\":\"sre-engineering-manager\",\"reqId\":\"200657773-1052\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Software and Services\",\"teamID\":\"teamsAndSubTeams-SFTWR\",\"teamCode\":\"SFTWR\"},\"type\":\"REQ\",\"homeOffice\":false,\"jobPositionId\":\"REQ-200657773\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"200609174-0321\",\"jobSummary\":\"People at Apple don’t just build products — they craft the kind of experience that has revolutionised entire industries. The diverse collection of our people and their ideas encourages innovation in everything we do. Imagine what you could do here! Join Apple, and help us leave the world better than we found it. At Apple, new ideas have a way of becoming extraordinary products, services, and customer experiences very quickly. Every single day, people do amazing things at Apple! \\n\\nApple designs consumer electronics that have touched millions and changed the way people interact with electronic devices around the world. Be part of the team with a state-of-the-art calibration and test ecosystem to manufacture Apple hardware products. \\n\\nThe team is looking for a system design engineer who is responsible for the design and deployment of systems that carry out calibration and performance validation of sensors on a well-known iPhone product line. You will be responsible for the full lifecycle of the test system, from prototyping to mass production deployment. You will work closely with the Sensing design group to define calibration and test procedures, and design high-precision instrumentation and systems to be able to perform this efficiently in a factory environment. \\n\\nAs a Calibration and Instrumentation Engineer, you will: \\n-  Develop state of the art measurement systems\\n-  Introduce cutting-edge technology to people around the world to make their lives better\\n-  Touch every aspect of a system, including HW design, SW development, vendor engagement, algorithm optimization, data mining and factory deployment\\n-  Work collaboratively with a creative and diverse team of expert engineers from all disciplines, including Systems Hardware, Product Design, Reliability, Software and Operations\",\"locations\":[{\"postLocationId\":\"postLocation-BGS\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Bengaluru\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200609174\",\"postingDate\":\"02 Jun 2026\",\"postingTitle\":\"Product Calibration and Test System Engineer\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-06-02T14:58:56.609Z\",\"transformedPostingTitle\":\"product-calibration-and-test-system-engineer\",\"reqId\":\"200609174-0321\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Hardware\",\"teamID\":\"teamsAndSubTeams-HRDWR\",\"teamCode\":\"HRDWR\"},\"type\":\"PIPE\",\"homeOffice\":false,\"jobPositionId\":\"PIPE-200609174\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"200663815-1052\",\"jobSummary\":\"At Apple, new ideas quickly transform into groundbreaking products, services, and customer experiences. Bring passion and dedication to your work, and there’s no telling what can be accomplished.\\nAs part of the Supply Chain Innovation team, you will play a pivotal role in building end-to-end, best-in-class software solutions for Apple’s Supply Chain needs, ranging from Supply Planning and Demand Planning to Product Distribution and beyond. You will collaborate with various internal stakeholders to define and implement solutions that optimize Apple’s internal business processes.\",\"locations\":[{\"postLocationId\":\"postLocation-HY1\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Hyderabad\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200663815\",\"postingDate\":\"29 May 2026\",\"postingTitle\":\"Lead Graph Engineer\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-05-29T10:54:38.558Z\",\"transformedPostingTitle\":\"lead-graph-engineer\",\"reqId\":\"200663815-1052\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Software and Services\",\"teamID\":\"teamsAndSubTeams-SFTWR\",\"teamCode\":\"SFTWR\"},\"type\":\"REQ\",\"homeOffice\":false,\"jobPositionId\":\"REQ-200663815\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"200665146-1052\",\"jobSummary\":\"The Applied Machine Learning team has been at the forefront of accelerating digital transformation through machine learning across Apple's enterprise ecosystem. The proven ML Platforms, Solutions, and Services provide a comprehensive suite of capabilities to achieve efficiency, agility, and innovation at Apple scale—serving business-critical needs across Apple’s enterprise.\\n\\nWe are seeking a highly motivated and skilled Engineering Manager to lead and scale the Search / Information Retrieval team. The ideal candidate will have a strong foundation in Java development, a solid understanding of distributed systems, hands-on experience in Search, Information Retrieval and relevancy tuning, and a keen interest in Generative AI (GenAI). You will play a critical role in building, scaling, and maintaining next-generation systems and applications that leverage the power of Search & GenAI technologies, ensuring robust, scalable, and efficient solutions.\",\"locations\":[{\"postLocationId\":\"postLocation-HY1\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Hyderabad\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200665146\",\"postingDate\":\"29 May 2026\",\"postingTitle\":\"Senior Engineering Manager - Applied Machine Learning - AiDP \",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-05-29T05:23:33.118Z\",\"transformedPostingTitle\":\"senior-engineering-manager-applied-machine-learning-aidp\",\"reqId\":\"200665146-1052\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Software and Services\",\"teamID\":\"teamsAndSubTeams-SFTWR\",\"teamCode\":\"SFTWR\"},\"type\":\"REQ\",\"homeOffice\":false,\"jobPositionId\":\"REQ-200665146\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"200664435-0321\",\"jobSummary\":\"Do you love understanding every detail of how new technologies work? Join the team that serves as Apple’s nerve center, our Information Systems and Technology group. There are countless ways you’ll contribute here, whether you’re coordinating technology needs for product launches, designing music solutions for retail locations, or ensuring the strength of in-store Wi-Fi connections. From Apple Pay to the Apple website to our data centers around the globe, you’ll help design and manage the massive systems that countless employees and customers rely on every day. You’ll also build custom tools for employees, empowering them to solve complex problems on their own. Join our team, and together we’ll explore all the ways to improve how Apple operates, freeing our employees to do what they do best: craft magical experiences for our customers. The people here at Apple don’t just build products - we craft the kind of wonder that’s revolutionized entire industries. It’s the diversity of those people and their ideas that supports the innovation that runs through everything we do, from amazing technology to industry-leading environmental efforts. Join Apple, and help us leave the world better than we found it. Our team builds cutting edge agentic assistant platform . This platform is  built on top of a phenomenal GenAI platform and leverage multiple frameworks. This position is an extraordinary opportunity for a competent, expert, and results-oriented Framework Software Engineer to define and build some of the best-in-class data platforms and products.\",\"locations\":[{\"postLocationId\":\"postLocation-BGS\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Bengaluru\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200664435\",\"postingDate\":\"28 May 2026\",\"postingTitle\":\"Senior Software Engineer - AI Data Platform\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-05-28T09:52:37.781Z\",\"transformedPostingTitle\":\"senior-software-engineer-ai-data-platform\",\"reqId\":\"200664435-0321\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Software and Services\",\"teamID\":\"teamsAndSubTeams-SFTWR\",\"teamCode\":\"SFTWR\"},\"type\":\"REQ\",\"homeOffice\": rgest online retail platforms, serving millions of customers globally.\\n\\nWe are looking for a self-driven Engineering Project Manager with experience in fast-paced software development or e-commerce environments, with a proven ability to lead end-to-end delivery across globally distributed teams.\",\"locations\":[{\"postLocationId\":\"postLocation-HY1\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Hyderabad\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200665097\",\"postingDate\":\"26 May 2026\",\"postingTitle\":\"Engineering Project Manager\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-05-26T08:19:30.517Z\",\"transformedPostingTitle\":\"engineering-project-manager\",\"reqId\":\"200665097-1052\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Corporate Functions\",\"teamID\":\"teamsAndSubTeams-CORSV\",\"teamCode\":\"CORSV\"},\"type\":\"PIPE\",\"homeOffice\":false,\"jobPositionId\":\"PIPE-200665097\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"200664631-1052\",\"jobSummary\":\"At Apple, we rely on our employees diverse set of backgrounds and perspectives to champion innovation through extraordinary ideas to surprise and delight our customers. These ideas can come from anywhere. Will that next phenomenal idea come from you?\\n\\nApple E-Business Services team is seeking an outstanding hands on Integration Software Engineer with passion for developing highly scalable integration platforms. This is an excellent opportunity for a self motivated, enthusiastic, result oriented person to design and build Java based B2B ‘infrastructure as code’ components using technologies like object storage and no sql databases. Enjoy the benefits of working in a fast growing business where you are encouraged to \\\"Think Different\\\" and where your efforts play a key role in the success of Apple's business.\",\"locations\":[{\"postLocationId\":\"postLocation-HY1\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Hyderabad\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200664631\",\"postingDate\":\"26 May 2026\",\"postingTitle\":\"Integration Engineering - Software Engineer\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-05-26T05:32:16.263Z\",\"transformedPostingTitle\":\"integration-engineering-software-engineer\",\"reqId\":\"200664631-1052\",\"managedPipelineRole\":false,\"standardWeeklyHours\":40,\"team\":{\"teamName\":\"Software and Services\",\"teamID\":\"teamsAndSubTeams-SFTWR\",\"teamCode\":\"SFTWR\"},\"type\":\"REQ\",\"homeOffice\":false,\"jobPositionId\":\"REQ-200664631\",\"isMultiLocation\":false,\"postExternal\":true},{\"id\":\"200664897-0321\",\"jobSummary\":\"Imagine what you could do here. The people here at Apple don't just create products — they create the kind of wonders that have revolutionized entire industries. It's the diversity of those people and their ideas that inspires the innovation that runs through everything we do, from amazing technology to industry-leading environmental efforts. Join Apple, and help us lead the future generation of innovation.\",\"locations\":[{\"postLocationId\":\"postLocation-BGS\",\"city\":\"\",\"stateProvince\":\"\",\"countryName\":\"India\",\"metro\":\"\",\"region\":\"\",\"name\":\"Bengaluru\",\"countryID\":\"iso-country-IND\",\"level\":5}],\"positionId\":\"200664897\",\"postingDate\":\"22 May 2026\",\"postingTitle\":\"Windows Systems Engineer- Fleet Operations Engineering\",\"localeInfo\":{\"languageCode\":\"en_UK\",\"dateFormat\":\"MMM D, YYYY\",\"defaultLocaleCode\":\"en-in\"},\"postDateInGMT\":\"2026-05-22T11:50:56.017Z\",\"transformedPostingTitle\":\"windows-systems-engineer-fleet-operations-engineering\",\"reqId\"
