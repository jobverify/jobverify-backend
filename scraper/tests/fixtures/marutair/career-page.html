<!doctype html>
<html lang="en">
  <head>
    <title>Career at Marut Air Ahmedabad, India</title>
  </head>
  <body>
    <main>
      <h1>Let's join our team</h1>
      <p>Our team strives to help new members reach their unlimited potential every day.</p>
      <form id="career-form" enctype="multipart/form-data">
        <label for="department">Department</label>
        <select id="department" name="department">
          <option>Sales and Marketing</option>
          <option>Production Engineer</option>
        </select>
        <label for="resume">Upload Resume</label>
        <input id="resume" type="file" name="resume" />
        <button type="submit">Submit</button>
      </form>
      <section aria-label="HR Department">
        <p>Email ID - jobs@marutair.com</p>
      </section>
    </main>
  </body>
</html>
