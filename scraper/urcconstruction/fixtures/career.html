<html>
  <head>
    <title>URC Construction Careers</title>
  </head>
  <body>
    <a href="/Career.aspx">Careers</a>
    <a href="/contact-us.aspx">Contact</a>
    <form method="post" action="./Career.aspx" enctype="multipart/form-data">
      <section class="hero-section" style="background: url('img/career-banner_1.jpg');">
        <h2 class="contact__heading">Work With Us</h2>
      </section>
      <p>
        We place a high value on internal growth and employee learning and
        development. Each employee begins their journey with us with above-industry
        standard training.
      </p>
      <input type="text" id="ContentPlaceHolder1_TxtMNo" placeholder="Contact Number" />
      <label>Department</label>
      <select id="department">
        <option value="0">Select Department</option>
        <option value="Finance &amp; Accounts Department">Finance &amp; Accounts Department</option>
        <option value="Human Resources Department">Human Resources Department</option>
        <option value="Operations Department">Operations Department</option>
        <option value="Business Development Department">Business Development Department</option>
      </select>
      <input type="text" id="ContentPlaceHolder1_txtloc" placeholder="Enter Current Location" />
      <input type="file" id="ContentPlaceHolder1_fuIndSamll" />
      <label>Please upload your resume as a .pdf, .doc, or .docx file only (max file size 2 mb)</label>
      <input type="submit" id="ContentPlaceHolder1_btnSubmit" value="Submit" />
    </form>
  </body>
</html>
