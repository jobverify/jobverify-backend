<head data-ph-id="ph-page-element-page21-Ln10zP"><meta name="robots" content="index" /><meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" /><meta content="ww" name="target_country">   <meta name="description" content="Apply for ASIC Senior Manager job with HPE in Bengaluru, Karnātaka, 560048. Engineering & QA at HPE" key-description="external-default-job-description">   <meta name="keywords" content="ASIC Senior Manager, Bengaluru, Karnātaka, 560048" key-keywords="external-default-job-keywords">   <link rel="canonical" href="https://careers.hpe.com/us/en/job/1207301/ASIC-Senior-Manager">   <meta name="twitter:card" content="summary_large_image">   <meta name="twitter:site" content="@HPE">   <meta name="twitter:creator" content="@Careers - HPE">   <meta name="twitter:image" content="https://cdn.phenompeople.com/CareerConnectResources/HPE1US/images/Social_TW-1762209366344.jpg" page-seo-overriden="true">   <meta name="twitter:title" content="ASIC Senior Manager in Bengaluru, Karnātaka, 560048 | Engineering & QA at HPE">   <meta name="twitter:description" content="Apply for ASIC Senior Manager job with HPE in Bengaluru, Karnātaka, 560048. Engineering & QA at HPE">   <meta property="og:type" content="website">   <meta property="og:image" content="https://cdn.phenompeople.com/CareerConnectResources/HPE1US/images/Social_FBLI-1762209479230.jpg" page-seo-overriden="true">   <meta property="og:site_name" content="HPE">   <meta property="og:url" content="https://careers.hpe.com/us/en/job/1207301/ASIC-Senior-Manager">   <meta property="og:title" content="ASIC Senior Manager in Bengaluru, Karnātaka, 560048 | Engineering & QA at HPE">   <meta property="og:description" content="Apply for ASIC Senior Manager job with HPE in Bengaluru, Karnātaka, 560048. Engineering & QA at HPE">   <meta property="fb:admins" content="">   <meta property="og:image:width" content="200">   <meta property="og:image:height" content="200">   <script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"HPE","value":"1207301"},"hiringOrganization":{"@type":"Organization","name":"HPE","sameAs":"https://careers.hpe.com/us/en","url":"https://careers.hpe.com/us/en/job/1207301/ASIC-Senior-Manager","logo":"https://assets.phenompeople.com/CareerConnectResources/pp/HPE1US/images/job_logo_config--1762467301660.png"},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"12.97194","longitude":"77.59369"},"address":{"@type":"PostalAddress","postalCode":"560048","addressCountry":"India","addressLocality":"Bengaluru","addressRegion":"Karnātaka"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"ASIC Senior Manager&lt;p style=\"text-align:inherit\"&gt;&nbsp;&nbsp;&lt;/p&gt;This role has been designed as ‘’Onsite’ with an expectation that you will primarily work from an HPE office.&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Who We Are:&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;p style=\"text-align:left\"&gt;Hewlett Packard Enterprise is the global edge-to-cloud company advancing the way people live and work. We help companies connect, protect, analyze, and act on their data and applications wherever they live, from edge to cloud, so they can turn insights into outcomes at the speed required to thrive in today’s complex world. Our culture thrives on finding new and better ways to accelerate what’s next. We know varied backgrounds are valued and succeed here. We have the flexibility to manage our work and personal needs. We make bold moves, together, and are a force for good. If you are looking to stretch and grow your career our culture will embrace you. Open up opportunities with HPE.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Job Description:&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&nbsp;&nbsp;&nbsp;&lt;/p&gt;&lt;p&gt;&lt;b&gt;What you&#39;ll do:&lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;Designs, analyzes, develops, modifies and evaluates VLSI components and hardware systems. Determines architecture and logic design, design verification through software developed for component and system simulation, and builds physical implementations through development of multidimensional designs involving the layout of complex integrated circuits. Analyzes designs to establish operating data, conducts experimental tests and evaluates results to enable prototype and production VLSI solutions. May direct support personnel in the preparation of detailed design, design testing and prototype fabrication.&lt;/p&gt;&lt;p&gt;&lt;b&gt;&lt;i&gt;Management Level Definition:&lt;/i&gt;&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Applies expert subject matter knowledge to manage staff activities in solving most complex business/technical issues within established policies. Manages activities of exempt individual contributors (typically Expert/Master) and/or MG1s. Has accountability for a large multi-department area(s) or location(s) with significant impact on business unit results and organizational strategy. Acts as a key advisor to senior management on the development of overall policies and long-term goals of the organization. Plans, manages, and monitors high-end operational/tactical activities of Staff. Staff members&#39; primary focus is on either high-end tactical or broad strategic issues or a combination of both. Recruits and supports development of direct staff members. Position typically reports to Director or above. &lt;br /&gt;&lt;br /&gt;Additional Guidance/Criteria: Manages and controls activities within a sub-region or Region; Typically manages 10 or more direct reports.  Span of Control guidelines may differ from these numbers.&lt;/p&gt;&lt;p&gt;&lt;i&gt;&lt;b&gt;Responsibilities:&lt;/b&gt;&lt;/i&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Provides leadership and direction for a team of individual contributors and project teams responsible for all stages of VLSI design and development for complex products, solutions and platforms; including design, validation and testing.&lt;/li&gt;&lt;li&gt;Self-directed in objectives and directions for major areas of responsibility including program, VLSI implementation and entire portfolio success.&lt;/li&gt;&lt;li&gt;Manages headcount, deliverables, schedules, and costs for multiple ongoing VLSI projects and programs, ensuring that resources are appropriately allocated and that goals, objectives, timelines, risks and budgets are met in accordance with program and organizational roadmaps.&lt;/li&gt;&lt;li&gt;Manages relationships with VLSI partners and suppliers, including setting expectations regarding deliverables, product quality, schedules, and costs; ensures that team members are effectively communicating and collaborating with VLSI partners and suppliers.&lt;/li&gt;&lt;li&gt;Build support for business direction.&lt;/li&gt;&lt;li&gt;Accountable for lab-wide process improvement and cost optimization opportunities in execution of VLSI programs.&lt;/li&gt;&lt;li&gt;Engages with program managers, marketing, supply chain, technical leaders and executives to communicate VLSI program status, escalate issues, and guide and influence VLSI strategic decision-making.&lt;/li&gt;&lt;li&gt;Ownership for setting &amp; measuring performance plans, coaching, career development, and total rewards administration to create a high performance team. Recognizes accomplishments, focuses on morale and owns lab-wide organizational health.&lt;/li&gt;&lt;li&gt;Accountable for building the organization&#39;s technical and management capabilities by hiring top and diverse VLSI talent. &lt;/li&gt;&lt;li&gt;Accountable for lab-wide rating processes &amp; results, total rewards strategy &amp; process, and promotion analysis, strategy, goals &amp; process.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;What you need to bring:&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Bachelor&#39;s or Master&#39;s degree in Electrical Engineering, Computer engineering or equivalent.&lt;/li&gt;&lt;li&gt;Advanced university degree preferred.&lt;/li&gt;&lt;li&gt;Typically 10 or more years of related work experience, including 5 or more years of people management experience.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;i&gt;&lt;b&gt;Knowledge and Skills:&lt;/b&gt;&lt;/i&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Advanced leadership skills, including coaching, teambuilding, conflict resolution, and management.&lt;/li&gt;&lt;li&gt;Advanced project management skills including time and risk management, resource prioritization, and project structuring.&lt;/li&gt;&lt;li&gt;Excellent analytical and problem solving skills.&lt;/li&gt;&lt;li&gt;Mastery of architecture and logic design, design verification through software developed for component and system simulation, and building physical implementations through development of multidimensional designs involving the layout of complex integrated circuits.&lt;/li&gt;&lt;li&gt;Mastery in executive written and verbal communication skills; mastery in English and local language.&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Additional Skills:&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;Accountability, Accountability, Action Planning, Active Learning, Active Listening, Agile Methodology, Agile Scrum Development, Analytical Thinking, Bias, Coaching, Creativity, Critical Thinking, Cross-Functional Teamwork, Data Analysis Management, Data Collection Management (Inactive), Data Controls, Design, Design Thinking, Empathy, Follow-Through, Group Problem Solving, Growth Mindset, Intellectual Curiosity (Inactive), Long Term Planning, Managing Ambiguity {+ 5 more}&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;What We Can Offer You:&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Health &amp; Wellbeing&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;We strive to provide our team members and their loved ones with a comprehensive suite of benefits that supports their physical, financial and emotional wellbeing.&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Personal &amp; Professional Development&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;We also invest in your career because the better you are, the better we all are. We have specific programs catered to helping you reach any career goals you have — whether you want to become a knowledge expert in your field or apply your skills to another division.&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Unconditional Inclusion&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;We are unconditionally inclusive in the way we work and celebrate individual uniqueness. We know varied backgrounds are valued and succeed here. We have the flexibility to manage our work and personal needs. We make bold moves, together, and are a force for good.&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Let&#39;s Stay Connected:&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;p style=\"text-align:left\"&gt;&lt;span&gt;Follow &lt;a href=\"http://instagram.com/hpecareers\" target=\"_blank\"&gt;&#64;HPECareers&lt;/a&gt; on Instagram to see the latest on people, culture and tech at HPE. &lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;#india&lt;h3&gt;&lt;/h3&gt;&lt;h3&gt;&lt;/h3&gt;#networking&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Job:&lt;/b&gt;&lt;/p&gt;Engineering&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Job Level:&lt;/b&gt;&lt;/p&gt;Manager_2&lt;p style=\"text-align:inherit\"&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span class=\"WPL0\"&gt;    &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span&gt;&lt;span class=\"WPL0\"&gt;    &lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;&lt;div&gt;& ct on business unit results and organizational strategy. Acts as a key advisor to senior management on the development of overall policies and long-term goals of the organization. Plans, manages, and monitors high-end operational/tactical activities of Staff. Staff members' primary focus is on either high-end tactical or broad strategic issues or a combination of both. Recruits and supports development of direct staff members. Position typically reports to Director or above. Additional Guidance/Criteria: Manages and controls activities within a sub-region or Region; Typically manages 10 or more direct reports. Span of Control guidelines may differ from these numbers. Responsibilities. Provides leadership and direction for a team of individual contributors and project teams responsible for all stages of VLSI design and development for complex products, solutions and platforms; including design, validation and testing. Self-directed in objectives and directions for major areas of responsibility including program, VLSI implementation and entire portfolio success. Manages headcount, deliverables, schedules, and costs for multiple ongoing VLSI projects and programs, ensuring that resources are appropriately allocated and that goals, objectives, timelines, risks and budgets are met in accordance with program and organizational roadmaps. Manages relationships with VLSI partners and suppliers, including setting expectations regarding deliverables, product quality, schedules, and costs; ensures that team members are effectively communicating and collaborating with VLSI partners and suppliers. Build support for business direction. Accountable for lab-wide process improvement and cost optimization opportunities in execution of VLSI programs. Engages with program managers, marketing, supply chain, technical leaders and executives to communicate VLSI program status, escalate issues, and guide and influence VLSI strategic decision-making. Ownership for setting & measuring performance plans, coaching, career development, and total rewards administration to create a high performance team. Recognizes accomplishments, focuses on morale and owns lab-wide organizational health. Accountable for building the organization's technical and management capabilities by hiring top and diverse VLSI talent. Accountable for lab-wide rating processes & results, total rewards strategy & process, and promotion analysis, strategy, goals & process. What you need to bring. Bachelor's or Master's degree in Electrical Engineering, Computer engineering or equivalent. Advanced university degree preferred. Typically 10 or more years of related work experience, including 5 or more years of people management experience. Knowledge and Skills. Advanced leadership skills, including coaching, teambuilding, conflict resolution, and management. Advanced project management skills including time and risk management, resource prioritization, and project structuring. Excellent analytical and problem solving skills. Mastery of architecture and logic design, design verification through software developed for component and system simulation, and building physical implementations through development of multidimensional designs involving the layout of complex integrated circuits. Mastery in executive written and verbal communication skills; mastery in English and local language. Additional Skills. Accountability, Accountability, Action Planning, Active Learning, Active Listening, Agile Methodology, Agile Scrum Development, Analytical Thinking, Bias, Coaching, Creativity, Critical Thinking, Cross-Functional Teamwork, Data Analysis Management, Data Collection Management (Inactive), Data Controls, Design, Design Thinking, Empathy, Follow-Through, Group Problem Solving, Growth Mindset, Intellectual Curiosity (Inactive), Long Term Planning, Managing Ambiguity {+ 5 more}. What We Can Offer You. Health & Wellbeing. We strive to provide our team members and their loved ones with a comprehensiv
