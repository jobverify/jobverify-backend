cted at Shridevi Institute of Engineering & Technology., Tumkur (SIET), Karnataka, on Friday, 13 February 2026.\n\nThe initiative covered 130 students from the Engineering and Technology departments across 6 batches, enabling a comprehensive evaluation of technical proficiency, analytical capability, and overall industry readiness. We witnessed strong participation and enthusiastic engagement throughout the process.\n\n🙏 We extend our sincere appreciation to Mr. Chetan Gubbi, Training and Placement Officer, for his valuable support and coordination in ensuring the seamless execution of the drive.\n\n👏 Congratulations to Mr. Satyam Singh Chauhan, Campus Relations Manager, and appreciation to Ms. Kiruba N, Associate Manager, Ms. Manisha Lakshmanakumar, Talent Acquisition Specialist, and the HR team for their committed efforts in driving and managing this engagement successfully.\n\nWe value our association with the institution and look forward to strengthening the industry–academia partnership in the future.\n\n#CampusHiring #VirtualAssessment #TechnicalRecruitment #SIET #Tumakuru #Placements #IndustryAcademia #EngineeringCareers #Sybrox #Sybroxtech","url":"https://www.linkedin.com/posts/sybroxtech_campushiring-virtualassessment-technicalrecruitment-activity-7428076786833637376-FzEX"},{"@context":"http://schema.org","@type":"SocialMediaPosting","author":{"@type":"Organization","name":"Sybrox","url":"https://in.linkedin.com/company/sybroxtech"},"datePublished":"2026-02-13T13:26:25.229Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":28},"mainEntityOfPage":"https://www.linkedin.com/posts/sybroxtech_campusplacementdrive-integraluniversity-activity-7428067023630565376-PdYO","text":"A Campus Placement Drive was successfully conducted at Integral University, Lucknow, Uttar Pradesh,\n\nThe initiative allowed us to engage with a talented pool of students and evaluate candidates in line with industry expectations and organizational requirements.\n\n🙏 We extend our sincere thanks to Mr. Mohammad-Shahnawaz, Training & Placement Officer, for his valuable support and coordination in making the drive successful.\n\nWe appreciate the cooperation of the students and faculty and look forward to continued industry–academia collaboration.\n\n#CampusPlacementDrive #IntegralUniversity #CampusHiring #Placements #IndustryAcademia #StudentCareers #Lucknow #Sybrox #Sybroxtech","url":"https://www.linkedin.com/posts/sybroxtech_campusplacementdrive-integraluniversity-activity-7428067023630565376-PdYO"},{"@context":"http://schema.org","@type":"SocialMediaPosting","author":{"@type":"Organization","name":"Sybrox","url":"https://in.linkedin.com/company/sybroxtech"},"datePublished":"2026-02-11T16:23:31.728Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":57},"mainEntityOfPage":"https://www.linkedin.com/posts/sybroxtech_campusplacementdrive-itmgorakhpur-campushiring-activity-7427386818670731264-N5uV","text":"📍 Campus Placement Drive | Institute of Technology and Management, Gorakhpur\n\nA Campus Placement Drive was successfully conducted at Institute of Technology and Management, Gorakhpur, Uttar Pradesh on Monday, 09 February 2026.\n\nThe initiative provided an excellent opportunity to interact with a talented pool of students and evaluate candidates in line with industry expectations and organizational requirements.\n\n👏 Credit to Mr. Piyush Upadhyay, Training & Placement Officer, for the effective planning and smooth execution of the drive.\n\n 🙏 We extend our sincere thanks to Mr. Ashish Kumar Singh, Head – Corporate Relations & Placement, for his continued guidance and institutional support.\n\n 👏 We also acknowledge Mr. Satyam Singh Chauhan, Campus Relations Manager, for leading the coordination and ensuring the success of the engagement from our end.\n\nWe appreciate the cooperation of the students and faculty and look forward to building a long-term industry–academia association.\n\n#CampusPlacementDrive #ITMGorakhpur #CampusHiring #Placements #IndustryAcademia #ProfessionalGrowth #StudentCareers #Sybrox #Sybroxtech","url":"https://www.linkedin.com/posts/sybroxtech_campusplacementdrive-itmgorakhpur-campushiring-activity-7427386818670731264-N5uV"},{"@context":"http://schema.org","@type":"SocialMediaPosting","author":{"@type":"Organization","name":"Sybrox","url":"https://in.linkedin.com/company/sybroxtech"},"datePublished":"2026-02-11T15:49:31.398Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":21},"mainEntityOfPage":"https://www.linkedin.com/posts/sybroxtech_hiring-backendengineer-backendlead-activity-7427378260910678018-YTL-","text":"🚀 Hiring: Senior Backend Engineer / Backend Lead\n\nAt Sybrox, we’re building a real-time ride-hailing platform where scale, uptime, and performance are critical.\n\nWe are hiring senior professionals only — engineers who have already built production systems, taken architectural ownership, and led backend initiatives.\n\nIf you want comfort, routine, or small impact, this role is not for you.\n\nIf you want to build systems that will run live trips, payments, and real-time communication at scale — let’s talk.\n\n💼 What You’ll Own\n✔ Backend architecture & technical direction\n✔ Scalable REST services handling high concurrency\n✔ Complete ride lifecycle (search → accept → start → complete)\n✔ Database performance & scaling\n✔ Real-time systems (WebSockets/events)\n✔ Integrations – Maps, Payments, Notifications\n✔ Mentoring engineers & enforcing quality\n✔ Reliability, security & release maturity\n\n🧠 What We Expect\n5–7+ years of backend experience\nStrong in Node.js (NestJS) or Java (Spring Boot)\nSolid PostgreSQL / MySQL knowledge\nRedis & caching hands-on\nReal-time / event-driven architecture exposure\nJWT & role-based systems\nAbility to take ownership beyond code\n\n🌟 Ideal Profile\nYou are a builder, a decision maker, and someone who can raise the engineering bar for everyone around you.\n\n📩 Apply or refer: careers@sybrox.com\n\nKnow someone perfect for this? Tag them or share this post.\n\n#Hiring #BackendEngineer #BackendLead #SeniorHiring #TechJobs #EngineeringJobs #NodeJS #NestJS #Java #SpringBoot #PostgreSQL #MySQL #Redis #WebSockets #APIDevelopment #SystemDesign #RideHailing #MobilityTech #RealTimeSystems #ScalableSystems #HighPerformance #StartupHiring #ProductEngineering #TechCareers #Developers #HiringNow","url":"https://www.linkedin.com/posts/sybroxtech_hiring-backendengineer-backendlead-activity-7427378260910678018-YTL-"},{"@context":"http://schema.org","@type":"SocialMediaPosting","author":{"@type":"Organization","name":"Sybrox","url":"https://in.linkedin.com/company/sybroxtech"},"datePublished":"2026-02-05T06:03:15.917Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":26},"mainEntityOfPage":"https://www.linkedin.com/posts/sybroxtech_campusplacementdrive-psvcollege-campushiring-activity-7425056397060661248-dAej","text":"📍 Campus Placement Drive | P.S.V. College of Engineering and Technology\n\nWe successfully conducted a Campus Placement Drive at P.S.V COLLEGE OF ENGINEERING AND TECHNOLOGY Friday, 30 January 2026.\nThe drive provided a valuable opportunity to engage with engineering students and assess candidates for entry-level roles aligned with industry requirements.\n\nCongratulations to Mr. Satyam Singh Chauhan, Campus Relations Manager, for the successful coordination and execution of the drive.\n\nSpecial thanks to Mr. D. Saravanan, Placement Officer, P.S.V. College of Engineering and Technology, for his support and cooperation.\nWe appreciate the participation of students and faculty and look forward to continued industry–academia collaboration.\n\n\n#CampusPlacementDrive #PSVCollege #CampusHiring #Placements #IndustryAcademia #StudentSuccess #sybrox #sybroxtech\n","url":"https://www.linkedin.com/posts/sybroxtech_campusplacementdrive-psvcollege-campushiring-activity-7425056397060661248-dAej"},{"@context":"http://schema.org","@type":"SocialMediaPosting","author":{"@type":"Organization","name":"Sybrox","url":"https://in.linkedin.com/company/sybroxtech"},"datePublished":"2026-02-05T05:50:00.323Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":16},"mainEntityOfPage":"https://www.linkedin.com/posts/sybroxtech_empowering-businesses-with-activity-7425053060089180161-aWIS","text":"Official Statement – Sybrox Tech Pvt. Ltd.\n\nAt Sybrox Tech Pvt. Ltd., we follow a structured and quality-driven hiring approach. As a growing startup with six months of operations, our recruitment process runs continuously and includes multiple interview rounds, ensuring we onboard only candidates who align with our technical and project standards.\n\nOur interview process is rigorous and skill-focused, particularly for fresh graduates. While challenging, it is designed to assess strong fundamentals, adaptability, and real-world project readiness.\n\nWe offer flexible work models, including 50% Work From Home and 40% Hybrid, based on role and project requirements.\n\nBackground verification is mandatory. Candidates with no history of arrears and 75% and above academic performance are eligible for direct placement opportunities.\n\nDespite being an early-stage startup, Sybrox offers competitive compensation in the IT sector, with CTC packages ranging from ₹3 LPA to ₹20 LPA, and most roles positioned between ₹4 LPA and ₹14 LPA, depending on skills and project alignment.\n\nWe commenced our first live project on 1st February 2026 and have secured multiple projects in the active pipeline. To meet growing project demands efficiently, we focus on high-skill, project-ready professionals.\n\nTo strengthen our talent pipeline, we introduced the Talent Development Program (TDP)—a 6-month structured training and evaluation program with mandatory project deployment, subject to performance. Candidates with basic knowledge in Python, Java, HTML, and CSS are eligible. The program is offered on a paid basis, covering professional training, evaluation, and project exposure.\n\nAt Sybrox, we maintain a transparent, non-discriminatory hiring philosophy, while ensuring strong delivery standards and long-term career growth for our team.\n\n— Sybrox Management\n\nwww.sybrox.com\n\n#sybrox #sybroxtech","url":"https://www.linkedin.com/posts/sybroxtech_empowering-businesses-with-activity-7425053060089180161-aWIS"},{"@context":"http://schema.org","@type":"SocialMediaPosting","author":{"@type":"Organization","name":"Sybrox","url":"https://in.linkedin.com/company/sybroxtech"},"datePublished":"2026-02-02T14:28:40.406Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":28},"mainEntityOfPage":"https://www.linkedin.com/posts/sybroxtech_campusplacementdrive-mgruniversity-placements-activity-7424096423572389888-5VW9","text":"📍 Campus Placement Drive | Dr. M.G.R. Educational & Research Institute\n\nWe successfully conducted a Campus Placement Drive at Dr. M.G.R. Educational & Research Institute (MGR University) on Wednesday, 28 January 2026, engaging with 4 batches and 178 students.\n\nThe session enabled us to interact with a diverse pool of talented students and assess candidates for entry-level opportunities aligned with industry expectations.\n\nSpecial thanks to Dr. C. Balakrishnan, Dean – Placement & Industry Institute Planning Cell, and Professor – FOMS, Dr. M.G.R. Educational & Research Institute, for his guidance, support, and coordination in making this placement drive a success.\n\nWe appreciate the enthusiastic participation of students and faculty and look forward to continued industry–academia collaboration.\n\n#CampusPlacementDrive #MGRUniversity #Placements #CampusHiring #IndustryAcademia #StudentCareers #Chennai #sybrox #sybroxtech","url":"https://www.linkedin.com/posts/sybroxtech_campusplacementdrive-mgruniversity-placements-activity-7424096423572389888-5VW9"},{"@context":"http://schema.org","@type":"SocialMediaPosting","author":{"@type":"Organization","name":"Sybrox","url":"https://in.linkedin.com/company/sybroxtech"},"datePublished":"2026-02-02T14:13:50.524Z","interactionStatistic":{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":16},"mainEntityOfPage":"https://www.linkedin.com/posts/sybroxtech_campusplacementdrive-satyugdarshan-engineeringcareers-activity-7424092691178668032-Snxk","text":"📍 Campus Placement Drive | Satyug Darshan Institute of Engineering & Technology\n\nWe successfully conducted a Campus Placement Drive at Satyug Darshan Institute of Engineering & Technology on Thursday, 29 January 2026.\n\nThe drive provided a great opportunity to interact with aspiring engineering graduates and assess candidates for various entry-level roles aligned with industry requirements.\n\nSpecial thanks to Mr. Samar Mahapatra, Training & Placement Officer, Satyug Darshan Institute of Engineering & Technology, for his support and coordination in making this drive successful.\n\nWe appreciate the participation of students and faculty and look forward to continued industry–academia collaboration.\n\n\n#CampusPlacementDrive #SatyugDarshan #EngineeringCareers #CampusHiring #Placements #IndustryAcademia #StudentSuccess #sybrox #sybroxtech\n","url":"https://www.linkedin.com/posts/sybroxtech_campusplacementdrive-satyugdarshan-engineeringcareers-activity-7424092691178668032-Snxk"},{"@context":"http://schema.org","@type":"Organization","name":"Sybrox","url":"https://in.linkedin.com/company/sybroxtech","address":{"type":"PostalAddress","addressLocality":"Chennai","addressRegion":"Tamil Nadu","addressCountry":"IN"},"description":"Sybrox Tech Pvt. Ltd. is a fast-growing IT, Cloud, and Consulting company delivering innovative digital solutions that empower businesses to transform and scale with confidence.\n\nWe specialize in Web & Mobile App Development, Cloud Infrastructure, IT Support, Staffing Solutions, and Corporate Training — helping startups, enterprises, and professionals thrive in a digital-first world.\n\nAt Sybrox, we bring together technology, talent, and transformation to build smart, reliable, and scalable products. Our agile teams of developers, designers, analysts, and consultants work collaboratively to deliver projects that drive measurable business impact.\n\nOur integrated service model ensures end-to-end execution — from concept and design to deployment and optimization — enabling clients to accelerate innovation, enhance productivity, and stay future-ready.\n\n🚀 Our Core Expertise\n• Web & Mobile Application Development (Frontend, Backend, UI/UX, Testing)\n• Cloud & Infrastructure Solutions (AWS, Azure, GCP, DevOps)\n• IT Support & Consulting (System Optimization, Cybersecurity, Automation)\n• Internship & Training Programs (Software, Cloud, Data, HR, and Business)\n• Staffing & Recruitment (RPO, Contract, Technical & Campus Hiring)\n\n🎯 Our Mission\nTo bridge technology and opportunity by creating impactful digital solutions, nurturing future talent, and delivering exceptional user experiences that inspire growth and innovation.\n\n💡 Why Choose Us\n• End-to-end IT & Consulting Expertise\n• Agile, Scalable, and Innovative Approach\n• Industry-Driven Internship & Placement Programs\n• Passionate Team, Proven Excellence\n\nSybrox continues to evolve as a trusted technology partner and innovation hub — transforming ideas into digital realities and enabling organizations to achieve sustainable success in a rapidly changing world.","numberOfEmployees":{"value":8,"@type":"QuantitativeValue"},"logo":{"contentUrl":"https://media.licdn.com/dms/image/v2/D4E0BAQFPnIERTo_H5w/company-logo_200_200/B4EZq7OhpyK
