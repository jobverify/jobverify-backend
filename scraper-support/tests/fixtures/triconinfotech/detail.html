<html><head><title>DevOps Engineer (Azure DevOps) - Portland - Tricon Infotech</title></head><body class="single-awsm_job_openings postid-312962"><h1>DevOps Engineer (Azure DevOps) &#8211; Portland</h1><div class="awsm-job-specification-job-location"><span class="awsm-job-specification-term">Portland</span></div><form id="awsm-application-form" method="post"><input type="hidden" name="awsm_job_id" value="312962"></form><script type="application/ld+json">{"@context":"http://schema.org/","@type":"JobPosting","title":"DevOps Engineer (Azure DevOps) &#8211; Portland","description":"<!-- wp:paragraph -->\n<p>The DevOps Engineer is responsible for designing, implementing, and supporting enterprise DevOps practices and automation solutions using Azure DevOps. This role partners with development, infrastructure, security, and operations teams to streamline software delivery, improve deployment reliability, optimize cloud infrastructure, and ensure continuous integration and continuous deployment (CI/CD) processes are aligned with organizational standards and best practices.&nbsp;</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>The ideal candidate possesses strong experience in Azure DevOps, Infrastructure as Code (IaC), automation, cloud technologies, release management, and Agile methodologies to enable efficient and secure software delivery across environments. </p>\n<!-- /wp:paragraph -->\n\n<!-- wp:paragraph {\"fontSize\":\"large\"} -->\n<p class=\"has-large-font-size\"><strong>Key Roles and Responsibilities </strong></p>\n<!-- /wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p><strong>Azure DevOps Administration &amp; Support</strong> </p>\n<!-- /wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Administer and maintain Azure DevOps Services, including organizations, projects, repositories, pipelines, artifacts, and service connections. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Manage user access, security groups, permissions, and governance policies. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Configure and maintain Azure DevOps agents, agent pools, and deployment groups. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Monitor platform health, troubleshoot issues, and provide ongoing support to development teams. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Implement Azure DevOps best practices, standards, and governance controls. </li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->\n\n<!-- wp:paragraph -->\n<p><strong>CI/CD Pipeline Development</strong>&nbsp;</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Design, build, and maintain automated CI/CD pipelines using Azure DevOps YAML and classic pipelines. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Automate build, test, release, and deployment processes across multiple environments. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Integrate quality gates, automated testing, and security scanning into deployment pipelines. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Support blue-green, rolling, and canary deployment strategies. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Optimize pipeline performance and reduce deployment times. </li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->\n\n<!-- wp:paragraph -->\n<p><strong>Infrastructure as Code (IaC)</strong>&nbsp;</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Develop and maintain Infrastructure as Code solutions using Terraform, ARM templates, or Bicep. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Automate provisioning and configuration of cloud infrastructure. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Ensure infrastructure deployments are repeatable, scalable, and compliant with organizational standards. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Maintain infrastructure version control and change tracking. </li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->\n\n<!-- wp:paragraph -->\n<p><strong>Cloud Platform Support</strong>&nbsp;</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Support Azure cloud infrastructure, including virtual machines, networking, storage, containers, and platform services. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Collaborate with cloud architects and infrastructure teams to implement scalable solutions. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Monitor cloud resource utilization and recommend optimization opportunities. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Assist with cloud migration and modernization initiatives. </li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->\n\n<!-- wp:paragraph -->\n<p><strong>Source Control &amp; Release Management</strong>&nbsp;</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Manage Git repositories, branching strategies, pull request workflows, and code review processes. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Establish and maintain release management procedures and deployment governance. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Support application versioning and release scheduling. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Ensure traceability from development through production deployment. </li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->\n\n<!-- wp:paragraph -->\n<p><strong>Monitoring &amp; Operational Excellence</strong>&nbsp;</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Implement monitoring, alerting, and logging solutions using Azure Monitor, Application Insights, and related tools. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Analyze system performance and identify opportunities for automation and improvement. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Support incident response, root cause analysis, and problem resolution. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Develop operational dashboards and reporting metrics. </li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->\n\n<!-- wp:paragraph -->\n<p><strong>Security &amp; Compliance</strong>&nbsp;</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Incorporate DevSecOps practices into CI/CD processes. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Implement security scanning, vulnerability assessments, and compliance controls. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Manage secrets, certificates, and secure configuration practices. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Ensure adherence to organizational security policies and regulatory requirements. </li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->\n\n<!-- wp:paragraph -->\n<p><strong>Collaboration &amp; Continuous Improvement</strong>&nbsp;</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Work closely with development, QA, security, and operations teams to improve delivery processes. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Provide technical guidance and mentorship on DevOps practices and tooling. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Document procedures, standards, and architecture designs. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Promote Agile, Lean, and continuous improvement methodologies across teams. </li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->\n\n<!-- wp:paragraph -->\n<p><strong>Required Qualifications</strong>&nbsp;</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Bachelor's degree in Computer Science, Information Technology, or related field, or equivalent experience. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>3+ years of experience supporting Azure DevOps environments. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Strong knowledge of CI/CD pipeline development and automation. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Experience with Azure cloud services and cloud-native architectures. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Hands-on experience with Git, YAML pipelines, Terraform, ARM, or Bicep. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Experience with scripting languages such as PowerShell, Python, or Bash. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Understanding of Agile and DevOps methodologies. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Strong troubleshooting, analytical, and problem-solving skills. </li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->\n\n<!-- wp:paragraph -->\n<p><strong>Preferred Qualifications</strong>&nbsp;</p>\n<!-- /wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Microsoft Certified: Azure DevOps Engineer Expert. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Microsoft Azure Administrator or Azure Solutions Architect certification. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Experience with Kubernetes, Docker, and container orchestration platforms. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Experience implementing DevSecOps practices. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Knowledge of monitoring and observability platforms. </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Experience supporting enterprise-scale application delivery environments. </li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->\n\n<!-- wp:paragraph -->\n<p><strong>Typical Deliverables</strong> </p>\n<!-- /wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>CI/CD pipeline automation </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Azure DevOps platform administration </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Infrastructure as Code solutions </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Cloud deployment automation </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Release management governance </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Monitoring and operational reporting </li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Security and compliance integrations</li>\n<!-- /wp:list-item -->\n\n<!-- wp:list-item -->\n<li>DevOps process improvement initiatives </li>\n<!-- /wp:list-item --></ul>\n<!-- /wp:list -->","datePosted":"2026-10-05T11:53:27+00:00","hiringOrganization":{"@type":"Organization","name":"Tricon Infotech","sameAs":"https://www.triconinfotech.com"},"employmentType":"FULL_TIME","jobLocation":{"@type":"Place","address":"Portland"}}</script></body></html>
