 <meta property="fb:admins" content="">   <meta property="og:image:width" content="200">   <meta property="og:image:height" content="200">   <script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Allianz Insurance","value":"90730"},"hiringOrganization":{"@type":"Organization","name":"Allianz Insurance","sameAs":"https://careers.allianz.com/global/en","url":"https://careers.allianz.com/global/en/job/90730/Integration-Architect-1915","logo":null},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"20.593684","longitude":"78.96288"},"address":{"@type":"PostalAddress","postalCode":"","addressCountry":"India","addressLocality":"","addressRegion":""},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;Integration Architecture Lead – Insurance (13–15+ years)&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt; • The Integration Architecture Lead is responsible for defining, governing, and leading the end‑to‑end enterprise integration architecture across multiple insurance Lines of Business, ensuring seamless interoperability between core platforms, finance systems, customer‑facing applications, data ecosystems, and external partner services under the guidance of Enterprise Architecture.&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt; • The role provides architectural leadership across agile delivery teams, vendor partners, and enterprise stakeholders, ensuring that all integration solutions are scalable, secure, compliant, and aligned with enterprise architecture standards.&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• &lt;strong&gt;Key objectives include: &lt;/strong&gt;&lt;/p&gt;&lt;ol&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Leading strategic integrations with core systems including GL/Finance, CRM, Payment Gateway/Payment Factory, Fraud systems, Master Data Management, Input/Output Management Systems, Document Management, and Data Lakehouse platforms. &lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Collaborating with business, operations, security, and enterprise architecture teams to ensure end‑to‑end alignment of technology decisions with business goals. &lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Designing and driving API‑first and event‑driven integration patterns across internal platforms and external ecosystems with the supports from respective platform owners and providers. &lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Maintaining enterprise‑grade architectural artefacts such as integration blueprints, canonical models, interface specifications, event models, sequence diagrams, and architectural decision records.&lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Ensuring integration alignment with business processes across all Lines of Business, including new business, underwriting, policy lifecycle, collections, renewals, claims, and financial posting.&lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt; Embedding harmonization, maintainability, reliability, performance, observability, auditability, and regulatory compliance into all integration designs and implementations. o&lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Guiding engineering leads, development teams, and vendors to ensure consistent implementation of integration patterns, coding standards, non‑functional requirements, and architectural governance. &lt;/li&gt;&lt;/ol&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;&lt;span style=\"font-size: 12pt;\"&gt;&lt;strong&gt; Qualification &amp; Experience Qualification: &lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• Bachelor in Engineering/MCA/M.sc/ M.S./ MBA in Systems, IT or Insurance or Finance Technical:&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• A senior technology leader (13-15+ years) with a proven track record of conceptualizing, designing, and delivering enterprise‑scale integration architectures in large, complex insurance or financial‑services organizations.&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• Deep experience defining and governing enterprise-wide integration architectures, ensuring secure, scalable, high‑performing connectivity across policy, underwriting, claims, billing, customer, partner, and finance systems.&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• Demonstrated success in leading integration modernization programs using API‑first, microservices‑based, and event‑driven patterns, establishing reusable services, canonical models, and shared integration assets across multiple Lines of Business. &lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• Extensive hands‑on expertise designing and implementing integrations using: o REST APIs, JSON, XML. Agentic and MCP knowledge are bonus. o Event streaming platforms (Kafka or equivalent) o Messaging protocols and standards (AMQP, JMS) o API gateways and cloud‑native integration services (AWS, Azure)&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• Strong delivery experience integrating with core insurance platforms across multiple domains (policy administration, claims, underwriting, billing, collections, renewals, customer servicing).&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• Successful track record designing and delivering high‑volume, mission‑critical integrations that support real‑time transactions, straight‑through processing, and batch‑based enterprise workflows.&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• Proven ability to design and govern integrations with:&lt;/p&gt;&lt;ol&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;GL / Finance Systems (SAP, Oracle Financials, or equivalent) &lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;CRM platforms (customer onboarding, sales, retention journeys) &lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Payment Gateway / Payment Factory solutions&lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Fraud management, screening, risk scoring systems&lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Master Data Management (MDM) platforms &lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Input/Output Management Systems &lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Document Management &amp; Customer Communication platforms &lt;/li&gt;&lt;li style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;Data Lakehouse or modern analytics ecosystems &lt;/li&gt;&lt;/ol&gt;&lt;p style=\"font-size: 10pt; font-family: Arial, sans-serif;\"&gt;• Strong foundation in Java‑based technology stacks or equivalent enterprise application platforms, with the ability to guide engineering teams in selecting appropriate frameworks and technologies for integration workloads. &lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• Solid understanding of non-functional architecture and the ability to design for: o security, identity, encryption, API protection o resilience, high availability, disaster recovery o performance, throughput, low-latency processing o observability, monitoring, logging, alerting&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• Demonstrated experience operationalizing architectural governance in a global enterprise environment, ensuring compliance with standards, security policies, and regulatory requirements while enabling agility via federated delivery teams.&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• Proven leadership capability guiding engineering leads, solution designers, platform teams, and vendor partners to deliver consistent, high‑quality, best‑practice integration implementations.&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• &lt;span style=\"font-size: 10pt;\"&gt;Ability to produce and maintain comprehensive architectural artefacts including integration blueprints, sequence diagrams, event models, interface contracts, API specifications, and Architectural Decision Records (ADRs).&lt;/span&gt;&lt;/p&gt;&lt;p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"&gt;• Experience leveraging GenAI/LLMs to accelerate engineering quality review, documentation, design validation, and developer productivity (advantageous for modern operating models). &lt;/p&gt; &lt;p&gt;&lt;span data-teams=\"true\"&gt;&lt;strong&gt;Your benefits:&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span data-teams=\"true\"&gt;·        We offer a hybrid work model which recognizes the value of striking a balance between in-person collaboration and remote working incl. up to 25 days per year working from abroad&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span data-teams=\"true\"&gt;·        We believe in rewarding performance and our compensation and benefits package includes a company bonus scheme, pension, employee shares program and multiple employee discounts (details vary by location)&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span data-teams=\"true\"&gt;·        From career development and digital learning programs to international career mobility, we offer lifelong learning for our employees worldwide and an environment where innovation, delivery and empowerment are fostered&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span data-teams=\"true\"&gt;·        Flexible working, health and wellbeing offers (including healthcare and parental leave benefits) support to balance family and career and help our people return from career breaks with experience that nothing else can teach&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span data-teams=\"true\"&gt;&lt;strong&gt;About Allianz Technology &lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span data-teams=\"true\"&gt;Allianz Technology is the global IT service provider for Allianz and delivers IT solutions that drive the digitalization of the Group. With more than 11,000 employees located in 20 countries around the globe, Allianz Technology works together with other Allianz entities in pioneering the digitalization of the financial services industry.We oversee the full digitalization spectrum – from one of the industry’s largest IT infrastructure projects that includes data centers, networking and security, to application platforms that span from workplace services to digital interaction. In short, we deliver full-scale, end-to-end IT solutions for Allianz in the digital age.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span data-teams=\"true\"&gt;&lt;strong&gt;D&amp;I statement &lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span data-teams=\"true\"&gt;Allianz Technology is proud to be an equal opportunity employer encouraging diversity in the working environment. We are interested in your strengths and experience. We welcome all applications from all people regardless of gender identity and/or expression, sexual orientation, race or ethnicity, age, nationality, religion, disability, or philosophy of life. &lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span data-teams=\"true\"&gt;Join us. Let´s care for tomorrow.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span data-teams=\"true\"&gt;You. IT&lt;/span&gt;&lt;/p&gt;","title":"Integration Architect _1915","datePosted":"2026-05-26","@context":"http://schema.org","occupationalCategory":"IT & Tech Engineering","directApply":false}</script>   <title key="default-job-title">Integration Architect _1915 in India | IT & Tech Engineering at Allianz</title>  <script id="structural-tag" type="application/ld+json">{"@context": "https://schema.org","@type": "WebPage","inLanguage": "en_global","name": "Global_Awards-copy","url": "https://careers.allianz.com/global/en/job/90730/Integration-Architect-1915","datePublished": "2026-06-25","dateModified": "2026-06-25"}</script>

pe":"JobPosting","workHours":"40 hours per week","description":"<p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">Integration Architecture Lead \u2013 Insurance (13\u201315+ years)</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u00A0\u2022 The Integration Architecture Lead is responsible for defining, governing, and leading the end\u2011to\u2011end enterprise integration architecture across multiple insurance Lines of Business, ensuring seamless interoperability between core platforms, finance systems, customer\u2011facing applications, data ecosystems, and external partner services under the guidance of Enterprise Architecture.</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u00A0\u2022 The role provides architectural leadership across agile delivery teams, vendor partners, and enterprise stakeholders, ensuring that all integration solutions are scalable, secure, compliant, and aligned with enterprise architecture standards.</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 <strong>Key objectives include: </strong></p><ol><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Leading strategic integrations with core systems including GL/Finance, CRM, Payment Gateway/Payment Factory, Fraud systems, Master Data Management, Input/Output Management Systems, Document Management, and Data Lakehouse platforms.\u00A0</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Collaborating with business, operations, security, and enterprise architecture teams to ensure end\u2011to\u2011end alignment of technology decisions with business goals.\u00A0</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Designing and driving API\u2011first and event\u2011driven integration patterns across internal platforms and external ecosystems with the supports from respective platform owners and providers.\u00A0</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Maintaining enterprise\u2011grade architectural artefacts such as integration blueprints, canonical models, interface specifications, event models, sequence diagrams, and architectural decision records.</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Ensuring integration alignment with business processes across all Lines of Business, including new business, underwriting, policy lifecycle, collections, renewals, claims, and financial posting.</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">\u00A0Embedding harmonization, maintainability, reliability, performance, observability, auditability, and regulatory compliance into all integration designs and implementations. o</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Guiding engineering leads, development teams, and vendors to ensure consistent implementation of integration patterns, coding standards, non\u2011functional requirements, and architectural governance.\u00A0</li></ol><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\"><span style=\"font-size: 12pt;\"><strong> Qualification &amp; Experience Qualification: </strong></span></p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Bachelor in Engineering/MCA/M.sc/ M.S./ MBA in Systems, IT or Insurance or Finance Technical:</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 A senior technology leader (13-15+ years) with a proven track record of conceptualizing, designing, and delivering enterprise\u2011scale integration architectures in large, complex insurance or financial\u2011services organizations.</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Deep experience defining and governing enterprise-wide integration architectures, ensuring secure, scalable, high\u2011performing connectivity across policy, underwriting, claims, billing, customer, partner, and finance systems.</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Demonstrated success in leading integration modernization programs using API\u2011first, microservices\u2011based, and event\u2011driven patterns, establishing reusable services, canonical models, and shared integration assets across multiple Lines of Business.\u00A0</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Extensive hands\u2011on expertise designing and implementing integrations using: o REST APIs, JSON, XML. Agentic and MCP knowledge are bonus. o Event streaming platforms (Kafka or equivalent) o Messaging protocols and standards (AMQP, JMS) o API gateways and cloud\u2011native integration services (AWS, Azure)</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Strong delivery experience integrating with core insurance platforms across multiple domains (policy administration, claims, underwriting, billing, collections, renewals, customer servicing).</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Successful track record designing and delivering high\u2011volume, mission\u2011critical integrations that support real\u2011time transactions, straight\u2011through processing, and batch\u2011based enterprise workflows.</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Proven ability to design and govern integrations with:</p><ol><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">GL / Finance Systems (SAP, Oracle Financials, or equivalent)\u00A0</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">CRM platforms (customer onboarding, sales, retention journeys)\u00A0</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Payment\u00A0Gateway / Payment Factory solutions</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Fraud management, screening, risk scoring systems</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Master Data Management (MDM) platforms\u00A0</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Input/Output Management Systems\u00A0</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Document Management &amp; Customer Communication platforms\u00A0</li><li style=\"font-size: 10pt; font-family: Arial, sans-serif;\">Data Lakehouse or modern analytics ecosystems\u00A0</li></ol><p style=\"font-size: 10pt; font-family: Arial, sans-serif;\">\u2022 Strong foundation in Java\u2011based technology stacks or equivalent enterprise application platforms, with the ability to guide engineering teams in selecting appropriate frameworks and technologies for integration workloads.\u00A0</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Solid understanding of non-functional architecture and the ability to design for: o security, identity, encryption, API protection o resilience, high availability, disaster recovery o performance, throughput, low-latency processing o observability, monitoring, logging, alerting</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Demonstrated experience operationalizing architectural governance in a global enterprise environment, ensuring compliance with standards, security policies, and regulatory requirements while enabling agility via federated delivery teams.</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Proven leadership capability guiding engineering leads, solution designers, platform teams, and vendor partners to deliver consistent, high\u2011quality, best\u2011practice integration implementations.</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 <span style=\"font-size: 10pt;\">Ability to produce and maintain comprehensive architectural artefacts including integration blueprints, sequence diagrams, event models, interface contracts, API specifications, and Architectural Decision Records (ADRs).</span></p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Experience leveraging GenAI/LLMs to accelerate engineering quality review, documentation, design validation, and developer productivity (advantageous for modern operating models).\u00A0</p> <p><span data-teams=\"true\"><strong>Your benefits:</strong></span></p><p><span data-teams=\"true\">\u00B7\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 We offer a hybrid work model which recognizes the value of striking a balance between in-person collaboration and remote working incl. up to 25 days per year working from abroad</span></p><p><span data-teams=\"true\">\u00B7\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 We believe in rewarding performance and our compensation and benefits package includes a company bonus scheme, pension, employee shares program and multiple employee discounts (details vary by location)</span></p><p><span data-teams=\"true\">\u00B7\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 From career development and digital learning programs to international career mobility, we offer lifelong learning for our employees worldwide and an environment where innovation, delivery and empowerment are fostered</span></p><p><span data-teams=\"true\">\u00B7\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 Flexible working, health and wellbeing offers (including healthcare and parental leave benefits) support to balance family and career and help our people return from career breaks with experience that nothing else can teach</span></p><p><span data-teams=\"true\"><strong>About Allianz Technology </strong></span></p><p><span data-teams=\"true\">Allianz Technology is the global IT service provider for Allianz and delivers IT solutions that drive the digitalization of the Group. With more than 11,000 employees located in 20 countries around the globe, Allianz Technology works together with other Allianz entities in pioneering the digitalization of the financial services industry.We oversee the full digitalization spectrum \u2013 from one of the industry\u2019s largest IT infrastructure projects that includes data centers, networking and security, to application platforms that span from workplace services to digital interaction. In short, we deliver full-scale, end-to-end IT solutions for Allianz in the digital age.</span></p><p><span data-teams=\"true\"><strong>D&amp;I statement </strong></span></p><p><span data-teams=\"true\">Allianz Technology is proud to be an equal opportunity employer encouraging diversity in the working environment. We are interested in your strengths and experience. We welcome all applications from all people regardless of gender identity and/or expression, sexual orientation, race or ethnicity, age, nationality, religion, disability, or philosophy of life.\u00A0</span></p><p><span data-teams=\"true\">Join us. Let\u00B4s care for tomorrow.</span></p><p><span data-teams=\"true\">You. IT</span></p>","title":"Integration Architect _1915","datePosted":"2026-05-18T06:49:40.000+0000","@context":"http://schema.org","occupationalCategory":"IT & Tech Engineering"},"requsitionType":"Standard","descriptionTeaser":"Integration Architecture Lead \u2013 Insurance (13\u201315+ years)\u00A0\u2022 The Integration Architecture Lead is responsible for defining, governing, and leading the end\u2011to\u2011end enterprise integration architecture acro","imApplyUrl":"https://career5.successfactors.eu/careers?company=AZGROUPPROD&career_job_req_id=90730&career_ns=job_application","stateName":"","state":"","jobUpdatedDate":"2026-05-20T03:07:57.402+0000","confidential":{"isConfidential latory requirements while enabling agility via federated delivery teams.</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Proven leadership capability guiding engineering leads, solution designers, platform teams, and vendor partners to deliver consistent, high\u2011quality, best\u2011practice integration implementations.</p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 <span style=\"font-size: 10pt;\">Ability to produce and maintain comprehensive architectural artefacts including integration blueprints, sequence diagrams, event models, interface contracts, API specifications, and Architectural Decision Records (ADRs).</span></p><p style=\"margin: 0.0in 0.0in 4.0pt; font-size: 10.0pt; font-family: Arial, sans-serif;\">\u2022 Experience leveraging GenAI/LLMs to accelerate engineering quality review, documentation, design validation, and developer productivity (advantageous for modern operating models).\u00A0</p> <p><span data-teams=\"true\"><strong>Your benefits:</strong></span></p><p><span data-teams=\"true\">\u00B7\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 We offer a hybrid work model which recognizes the value of striking a balance between in-person collaboration and remote working incl. up to 25 days per year working from abroad</span></p><p><span data-teams=\"true\">\u00B7\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 We believe in rewarding performance and our compensation and benefits package includes a company bonus scheme, pension, employee shares program and multiple employee discounts (details vary by location)</span></p><p><span data-teams=\"true\">\u00B7\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 From career development and digital learning programs to international career mobility, we offer lifelong learning for our employees worldwide and an environment where innovation, delivery and empowerment are fostered</span></p><p><span data-teams=\"true\">\u00B7\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 Flexible working, health and wellbeing offers (including healthcare and parental leave benefits) support to balance family and career and help our people return from career breaks with experience that nothing else can teach</span></p><p><span data-teams=\"true\"><strong>About Allianz Technology </strong></span></p><p><span data-teams=\"true\">Allianz Technology is the global IT service provider for Allianz and delivers IT solutions that drive the digitalization of the Group. With more than 11,000 employees located in 20 countries around the globe, Allianz Technology works together with other Allianz entities in pioneering the digitalization of the financial services industry.We oversee the full digitalization spectrum \u2013 from one of the industry\u2019s largest IT infrastructure projects that includes data centers, networking and security, to application platforms that span from workplace services to digital interaction. In short, we deliver full-scale, end-to-end IT solutions for Allianz in the digital age.</span></p><p><span data-teams=\"true\"><strong>D&amp;I statement </strong></span></p><p><span data-teams=\"true\">Allianz Technology is proud to be an equal opportunity employer encouraging diversity in the working environment. We are interested in your strengths and experience. We welcome all applications from all people regardless of gender identity and/or expression, sexual orientation, race or ethnicity, age, nationality, religion, disability, or philosophy of life.\u00A0</span></p><p><span data-teams=\"true\">Join us. Let\u00B4s care for tomorrow.</span></p><p><span data-teams=\"true\">You. IT</span></p>","locale":"en_GLOBAL","title":"Integration Architect _1915","talentSegmentCluster":"Complex","jobSeqNo":"AISAIPGB90730EXTERNALENGLOBAL","postedDate":"2026-05-18T06:49:40.000+0000","postingStatus":"Open","postedDateTrack":["2026-04-28T08:26:52.000Z","2026-05-18T06:49:40.000Z"],"ml_highlight":"Step into the role of
